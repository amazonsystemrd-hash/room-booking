  .brand-preview-bullets { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
  .brand-preview-bullets li { font-size: 10px; color: rgba(255,255,255,.7); display: flex; align-items: center; gap: 5px; }
  .brand-preview-footer { margin-top: auto; padding-top: 14px; font-size: 9px; color: rgba(255,255,255,.4); display: flex; justify-content: space-between; }
  /* Mobile preview */
  .brand-preview-mobile { border-radius: var(--r-2); overflow: hidden; background: var(--surface); border: 1px solid var(--border-strong); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .brand-preview-mobile-hero { height: 80px; border-radius: var(--r-1); background: var(--surface-2); border: 1px dashed var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-subtle); background-size: cover; background-position: center; }
  .brand-preview-mobile-headline { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .brand-preview-mobile-headline em { font-style: italic; color: var(--text-muted); }
  @media (max-width: 860px) { .brand-layout { flex-direction: column; } .brand-form { flex: none; width: 100%; } .brand-preview-col { width: 100%; position: static; } }
</style>

<div id="root"></div>

<script>
'use strict';

/* ────────────────────────────────────────────────────────────────────
   SUPABASE CONFIGURATION
   ① Go to supabase.com → your project → Project Settings → API
   ② Copy "Project URL" → paste as SUPABASE_URL below
   ③ Copy "anon public" key → paste as SUPABASE_KEY below
   The app works without a DB (uses built-in demo data) if you leave
   these as the placeholder strings.
──────────────────────────────────────────────────────────────────── */
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL'; // e.g. https://abcxyz.supabase.co
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';    // starts with eyJ…

// db is null when unconfigured or when SDK failed to load — the app
// automatically falls back to its built-in mock data in that case.
const db = (
  typeof supabase !== 'undefined' &&
  SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL' &&
  SUPABASE_KEY !== 'YOUR_SUPABASE_ANON_KEY'
) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ────────────────────────────────────────────────────────────────────
   ICONS
──────────────────────────────────────────────────────────────────── */
const ICONS = {
  menu:    '<path d="M4 6h16M4 12h16M4 18h16"/>',
  close:   '<path d="M6 6l12 12M18 6L6 18"/>',
  back:    '<path d="M15 6l-6 6 6 6"/>',
  forward: '<path d="M9 6l6 6-6 6"/>',
  check:   '<path d="M4 12l5 5 11-12"/>',
  plus:    '<path d="M12 5v14M5 12h14"/>',
  minus:   '<path d="M5 12h14"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>',
  list:    '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  user:    '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
  users:   '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 11a4 4 0 0 0 0-8"/><path d="M22 21c0-3-2-6-5-7"/>',
  phone:   '<path d="M5 4h3l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  mail:    '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/>',
  door:    '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="14" cy="13" r=".8" fill="currentColor"/>',
  clock:   '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  download:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
  help:    '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12c0 .6-.1 1.1-.2 1.6l2.1 1.6-2 3.4-2.5-1a7 7 0 0 1-2.7 1.6L13.3 22h-2.6l-.4-2.7a7 7 0 0 1-2.7-1.6l-2.5 1-2-3.4 2.1-1.6A7 7 0 0 1 5 12c0-.6.1-1.1.2-1.6L3.1 8.8l2-3.4 2.5 1a7 7 0 0 1 2.7-1.6L10.7 2h2.6l.4 2.7a7 7 0 0 1 2.7 1.6l2.5-1 2 3.4-2.1 1.6c.1.5.2 1 .2 1.7z"/>',
  logout:  '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4M6 12h12"/>',
  sparkle: '<path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15l-1.7-4L6 9.3l4.3-1.7z"/>',
  info:    '<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".7" fill="currentColor"/>',
  warn:    '<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".6" fill="currentColor"/>',
  'chevron-down': '<path d="M6 9l6 6 6-6"/>',
  catering: '<path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
};

function icon(name, size = 18, stroke = 1.6) {
  const body = ICONS[name] || '';
  return `<span class="icon"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${body}</svg></span>`;
}

function logoMarkSVG(size = 28) {
  return `<svg class="logo-mark" width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
    <rect x="1" y="1" width="30" height="30" rx="7" fill="var(--accent)"/>
    <path d="M9 22V10h7.5a4 4 0 0 1 1.6 7.6L22 22h-3.5l-3.4-4.3H12V22H9zm3-7h4a1.5 1.5 0 0 0 0-3h-4v3z" fill="white"/>
  </svg>`;
}
/* logoMark — renders custom image when CONFIG.logoMarkUrl is set, else built-in SVG.
   Pass overrideUrl to preview an unsaved URL (used in brand preview panel). */
function logoMark(size = 28, overrideUrl) {
  const url = overrideUrl !== undefined ? overrideUrl : CONFIG.logoMarkUrl;
  if (url) {
    return `<img class="logo-mark" src="${escapeHTML(url)}" width="${size}" height="${size}" style="object-fit:contain;border-radius:var(--r-1);flex-shrink:0;" alt="logo">`;
  }
  return logoMarkSVG(size);
}

function logoHTML(size = 28) {
  return `<span class="logo">${logoMark(size)}<span class="logo-text"><span class="logo-name">${escapeHTML(CONFIG.brandName)}</span><span class="logo-sub">${escapeHTML(CONFIG.brandSub)}</span></span></span>`;
}

function googleG(size = 18) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
    <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
    <path fill="#FBBC05" d="M11.69 28.18c-.44-1.32-.69-2.73-.69-4.18s.25-2.86.69-4.18v-5.7H4.34A21.99 21.99 0 0 0 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>

/* Rooms — parent/child model (per implement-plan §2).
   Parent (Grand) is available only when *every* child is free at that slot.
   Booking the parent occupies all children simultaneously. */
const ROOMS = {
  SmallRoom_A: { id: 'SmallRoom_A', name: 'Studio A',  minCap: 1, maxCap: 7,  rate: 280, blurb: 'Compact, north-facing, fibre wifi, 4K display.', parentId: 'GrandRoom' },
  SmallRoom_B: { id: 'SmallRoom_B', name: 'Studio B',  minCap: 1, maxCap: 7,  rate: 280, blurb: 'Compact, mirrored to Studio A, whiteboard wall.', parentId: 'GrandRoom' },
  GrandRoom:   { id: 'GrandRoom',   name: 'The Grand', minCap: 8, maxCap: 16, rate: 560, blurb: 'Combined suite, projector + conference camera.', parentId: null },
};
const ALL_ROOM_IDS = ['SmallRoom_A', 'SmallRoom_B', 'GrandRoom'];
const CHILD_ROOM_IDS = ALL_ROOM_IDS.filter(id => ROOMS[id].parentId);
const PARENT_ROOM_IDS = ALL_ROOM_IDS.filter(id => !ROOMS[id].parentId && ALL_ROOM_IDS.some(c => ROOMS[c].parentId === id));
function childrenOf(parentId) { return ALL_ROOM_IDS.filter(id => ROOMS[id].parentId === parentId); }

/* ── Parent-Child booking constraints ─────────────────────────────────────
   Rule 1: If a Parent room is booked, ALL of its Child rooms are blocked.
   Rule 2: If a Child room is booked, its Parent room is blocked. Sibling
           Child rooms remain available.

   Helper: parse a booking's "HH:MM – HH:MM" string into {sh, eh} integers. */
function bookingHours(b) {
  const m = b.time && b.time.match(/(\d+):(\d+)\s*[–\-]\s*(\d+):(\d+)/);
  return m ? { sh: +m[1], eh: +m[3] } : null;
}

/* For a given roomId on a specific date at a specific hour, returns the
   booking that blocks it (directly OR via parent/child cascade) or null.
   Skips rejected/cancelled bookings. */
function bookingAffectingRoomAt(roomId, date, hour) {
  if (!ROOMS[roomId]) return null;
  for (const b of api.bookings) {
    if (['rejected','cancelled'].includes(b.status)) continue;
    let bookDate;
    try { bookDate = new Date(b.date); } catch { continue; }
    if (!sameDay(bookDate, date)) continue;
    const t = bookingHours(b);
    if (!t || hour < t.sh || hour >= t.eh) continue;

    const bookedId = ALL_ROOM_IDS.find(id => ROOMS[id].name === b.room);
    if (!bookedId) continue;

    // Direct hit — this exact room is booked.
    if (bookedId === roomId) return b;
    // Rule 1 — queried room is a child of the booked parent.
    if (ROOMS[roomId].parentId === bookedId) return b;
    // Rule 2 — queried room is the parent of the booked child.
    if (ROOMS[bookedId].parentId === roomId) return b;
    // Siblings (same parent, different rooms) are NOT blocked — fall through.
  }
  return null;
}

/* Returns the first conflicting booking for a proposed slot, applying
   parent-child rules. Used as a final safety check at submission time. */
function findBookingConflict(roomId, date, startHour, endHour) {
  for (let h = startHour; h < endHour; h++) {
    const b = bookingAffectingRoomAt(roomId, date, h);
    if (b) return b;
  }
  return null;
}

/* Returns the blockout (or null) covering the given room at the given hour,
   applying the same parent-child cascade as bookings:
     - room='All'  → covers every room
     - parent blockout → cascades to all children   (Rule 1)
     - child  blockout → cascades to the parent     (Rule 2)
     - sibling children remain unaffected.
   Empty start/end means whole-day. */
function blockoutAffectingRoomAt(roomId, date, hour) {
  const room = ROOMS[roomId];
  if (!room) return null;
  const key = dateKey(date);

  for (const b of api.blockouts) {
    if (b.date !== key) continue;
    // Time window check (whole-day if no start/end)
    if (b.start || b.end) {
      const s = parseInt(b.start, 10) / 100, e = parseInt(b.end, 10) / 100;
      if (hour < s || hour >= e) continue;
    }
    // 'All' (or unspecified) → applies to every room.
    if (b.room === 'All' || !b.room) return b;

    const blkRoomId = ALL_ROOM_IDS.find(id => ROOMS[id].name === b.room);
    if (!blkRoomId) continue;

    if (blkRoomId === roomId)               return b; // direct
    if (room.parentId === blkRoomId)        return b; // Rule 1
    if (ROOMS[blkRoomId].parentId === roomId) return b; // Rule 2
  }
  return null;
}

/* Today, in the user's local timezone, with the time component zeroed out
   so date-only comparisons (sameDay, calendar cell highlighting, "is past"
   checks) work consistently. Previously hardcoded to 2026-05-14 for mock-data
   layout — now reads the real clock so the booking calendar advances each day. */
function today() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function sameDay(a, b) { return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
/* Custom dropdown — drop-in replacement for <select>. Renders a button
   trigger; clicking it toggles a popup of option buttons. Wire-up:

     - Call renderDropdown({ key, value, options, placeholder, hasError, disabled })
       where `key` is a unique id used to track the open state and dispatch picks.
     - On pick, fire a callback via `data-dd-on-pick` which routes through onClick.

   All open-state lives in state.openDropdown (single open at a time). */
function renderDropdown({ key, value, options, placeholder = 'Select…', hasError = false, disabled = false, ariaLabel = '' }) {
  const open = state.openDropdown === key && !disabled;
  const selected = options.find(o => o.value === value);
  const labelText = selected ? selected.label : placeholder;
  const labelCls = selected ? '' : 'placeholder';
  return `
    <div class="dropdown" data-dd-key="${escapeHTML(key)}">
      <button type="button" class="dropdown-trigger ${open ? 'open' : ''} ${hasError ? 'error' : ''}" ${disabled ? 'disabled' : ''}
              data-action="toggle-dropdown" data-key="${escapeHTML(key)}" aria-label="${escapeHTML(ariaLabel || placeholder)}" aria-expanded="${open}">
        <span class="dropdown-value ${labelCls}">${escapeHTML(labelText)}</span>
        <span class="dropdown-chevron">${icon('chevron-down', 16)}</span>
      </button>
      ${open ? `
        <div class="dropdown-popup" role="listbox">
          ${options.map(o => `
            <button type="button" class="dropdown-option ${o.value === value ? 'selected' : ''}"
                    data-action="pick-dropdown" data-key="${escapeHTML(key)}" data-value="${escapeHTML(o.value)}">
              <span class="dropdown-option-label">${escapeHTML(o.label)}</span>
              <span class="dropdown-check">${icon('check', 14)}</span>
            </button>
          `).join('')}
        </div>
      ` : ''}
    </div>`;
}

// Toast notifications — append a transient toast to <body>, fade in/out,
// auto-dismiss. Lives outside #root so render() can't destroy it.
function showToast(message, kind = 'success') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = `toast toast-${kind}`;
  t.innerHTML = `${icon(kind === 'success' ? 'check' : 'warn', 16)} <span>${escapeHTML(message)}</span>`;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('visible'));
  setTimeout(() => {
    t.classList.remove('visible');
    setTimeout(() => t.remove(), 250);
  }, 2400);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function seededRand(seed, idx) {
  let h = 2166136261;
  const s = seed + ':' + idx;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}
function isFullDayBlockout(date) {
  const key = dateKey(date);
  return api.blockouts.some(b => b.date === key && (b.room === 'All' || !b.room) && !b.start && !b.end);
}
function isRoomBlockoutAtSlot(roomName, date, slotIdx) {
  const key = dateKey(date);
  const hour = SLOT_HOURS[slotIdx];
  return api.blockouts.some(b => {
    if (b.date !== key) return false;
    if (b.room !== 'All' && b.room !== roomName) return false;
    if (!b.start && !b.end) return true; // whole day
    const s = parseInt(b.start, 10) / 100, e = parseInt(b.end, 10) / 100;
    return hour >= s && hour < e;
  });
}

/* Slot availability matrix.
   1. Generate child rooms independently (seeded).
   2. Stamp out a few "whole suite" parent bookings — when present, both
      children must show 'occupied' and the parent shows 'occupied' too.
   3. Otherwise the parent is derived: 'available' only when every child
      is 'available' at that slot. */
function generateDayData(date) {
  const key = dateKey(date);
  const t = today();
  const past = date < new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const fullBlock = isFullDayBlockout(date);

  const mkChild = (roomId, roomName) => SLOT_HOURS.map((_, i) => {
    if (past || fullBlock) return 'blocked';
    if (isRoomBlockoutAtSlot(roomName, date, i)) return 'blocked';
    const r = seededRand(key + roomId, i);
    if (r < 0.16) return 'occupied';
    if (r < 0.22) return 'submitted';
    if (r < 0.27) return 'blocked';
    return 'available';
  });

  const data = {};
  CHILD_ROOM_IDS.forEach(id => { data[id] = mkChild(id, ROOMS[id].name); });

  PARENT_ROOM_IDS.forEach(pid => {
    const kids = childrenOf(pid);
    data[pid] = SLOT_HOURS.map((_, i) => {
      if (past || fullBlock) return 'blocked';
      if (isRoomBlockoutAtSlot(ROOMS[pid].name, date, i)) return 'blocked';
      // Stamp occasional "whole suite" parent bookings.
      const r = seededRand(key + pid + ':whole', i);
      if (r < 0.10) {
        // Cascade — children must reflect the parent occupation.
        kids.forEach(cid => { if (data[cid][i] === 'available') data[cid][i] = 'occupied'; });
        return 'occupied';
      }
      // Derived: parent free iff every child free.
      const allFree = kids.every(cid => data[cid][i] === 'available');
      if (allFree) return 'available';
      const anyOccupied = kids.some(cid => data[cid][i] === 'occupied');
      const anySubmitted = kids.some(cid => data[cid][i] === 'submitted');
      const anyBlocked = kids.some(cid => data[cid][i] === 'blocked');
      if (anyOccupied) return 'occupied';
      if (anySubmitted) return 'submitted';
      if (anyBlocked) return 'blocked';
      return 'occupied';
    });
  });

  // Rooms with no parent/child relation — leave as independent children.
  ALL_ROOM_IDS.forEach(id => {
    if (!data[id]) data[id] = mkChild(id, ROOMS[id].name);
  });

  /* Overlay blockouts with parent-child cascade so the booking flow refuses
     conflicting slots. The initial mkChild pass only handles direct +
     'All' blockouts via isRoomBlockoutAtSlot — this overlay adds Rule 1
     (parent → children) and Rule 2 (child → parent). */
  api.blockouts.forEach(b => {
    if (b.date !== dateKey(date)) return;
    // Determine slot index range
    let startIdx, endIdx;
    if (!b.start && !b.end) {
      startIdx = 0; endIdx = SLOT_HOURS.length - 1;
    } else {
      const sh = parseInt(b.start, 10) / 100, eh = parseInt(b.end, 10) / 100;
      startIdx = SLOT_HOURS.indexOf(sh);
      endIdx   = SLOT_HOURS.indexOf(eh - 1);
      if (startIdx < 0 || endIdx < 0) return;
    }
    // Determine which room IDs the cascade applies to
    let targetIds;
    if (b.room === 'All' || !b.room) {
      targetIds = [...ALL_ROOM_IDS];
    } else {
      const blkRoomId = ALL_ROOM_IDS.find(id => ROOMS[id].name === b.room);
      if (!blkRoomId) return;
      targetIds = [blkRoomId];
      if (!ROOMS[blkRoomId].parentId) targetIds.push(...childrenOf(blkRoomId)); // Rule 1
      if (ROOMS[blkRoomId].parentId)  targetIds.push(ROOMS[blkRoomId].parentId); // Rule 2
    }
    targetIds.forEach(rid => {
      if (!data[rid]) return;
      for (let i = startIdx; i <= endIdx; i++) data[rid][i] = 'blocked';
    });
  });

  /* Overlay real bookings (api.bookings) onto the matrix, applying the
     parent-child cascade defined in `bookingAffectingRoomAt`. This is what
     causes the booking-flow slot picker to refuse conflicts in real time. */
  api.bookings.forEach(b => {
    if (['rejected','cancelled'].includes(b.status)) return;
    let bookDate;
    try { bookDate = new Date(b.date); } catch { return; }
    if (!sameDay(bookDate, date)) return;
    const t = bookingHours(b);
    if (!t) return;
    const bookedId = ALL_ROOM_IDS.find(id => ROOMS[id].name === b.room);
    if (!bookedId) return;
    const room = ROOMS[bookedId];

    // Which rooms get blocked by this booking?
    const affected = [bookedId];
    if (!room.parentId)        affected.push(...childrenOf(bookedId));   // Rule 1
    if (room.parentId && ROOMS[room.parentId]) affected.push(room.parentId); // Rule 2

    const targetState = b.status === 'submitted' ? 'submitted' : 'occupied';
    affected.forEach(rid => {
      if (!data[rid]) return;
      const startIdx = SLOT_HOURS.indexOf(t.sh);
      const endIdx   = SLOT_HOURS.indexOf(t.eh - 1);
      if (startIdx < 0 || endIdx < 0) return;
      for (let i = startIdx; i <= endIdx; i++) {
        // Don't downgrade a 'blocked' (blockout) slot.
        if (data[rid][i] === 'blocked') continue;
        data[rid][i] = targetState;
      }
    });
  });

  return data;
}

/* Rooms that match a given guest count (per plan §2). */
function roomsForGuests(guests) {
  if (guests == null) return [];
  return ALL_ROOM_IDS.filter(id => guests >= ROOMS[id].minCap && guests <= ROOMS[id].maxCap);
}
function rollupDay(d) {
  const flat = [...d.GrandRoom, ...d.SmallRoom_A, ...d.SmallRoom_B];
  const avail = flat.filter(s => s === 'available').length;
  if (avail === 0) return 'occupied';
  if (avail < 12) return 'submitted';
  return 'available';
}

function statusColor(s) {
  switch (s) {
    case 'available': return 'var(--available)';
    case 'submitted': return 'var(--submitted)';
    case 'occupied':  return 'var(--occupied)';
    default:          return 'var(--blocked)';
  }
}

function render() {
  const root = document.getElementById('root');

  // ── Loading splash — shown while Supabase data loads on first boot ─
  if (state.loading) {
    root.innerHTML = renderLoading();
    attachListeners();
    return;
  }

  // ── Partial re-render for in-modal interactions ──────────────────
  // When the booking wizard is open, keep the .sheet-overlay AND the .sheet
  // containers physically in the DOM — only swap the inner contents (head,
  // body, foot). This prevents the backdrop / panel from being destroyed
  // and re-inserted on every click, which was the cause of the visible flash.
  if (state.screen === 'app' && state.route === 'user' && state.flow.open) {
    const existingSheet = root.querySelector('.sheet');
    if (existingSheet) {
      // Preserve scroll position of the sheet body across the partial render —
      // otherwise clicking a slot rebuilds .sheet-body and resets scrollTop to 0,
      // making the modal appear to "jump to the top".
      const oldBody = existingSheet.querySelector('.sheet-body');
      const savedScrollTop = oldBody ? oldBody.scrollTop : 0;
      const tmp = document.createElement('div');
      tmp.innerHTML = renderFlow();
      const newSheet = tmp.querySelector('.sheet');
      if (newSheet) {
        existingSheet.innerHTML = newSheet.innerHTML;
        const newBody = existingSheet.querySelector('.sheet-body');
        if (newBody) newBody.scrollTop = savedScrollTop;
        attachListeners();
        syncConfirmModalHost();
        syncScannerStream();
        return;
      }
    }
  }

  // ── Partial re-render for an open detail modal ───────────────────
  // Same idea as the sheet path above: when a detail modal is open and a
  // click only changes content inside it (admin status transitions, the
  // inline booking edit, catering qty/cat tabs, etc.), swap the inner
  // markup of the existing .detail-modal element instead of rebuilding
  // the whole root. The overlay and panel stay physically in the DOM,
  // so there's no flash and no focus loss.
  if (state.screen === 'app' && state.detailModal) {
    const existingDetail = root.querySelector('.detail-modal');
    if (existingDetail) {
      const oldBody = existingDetail.querySelector('.detail-body');
      const savedScrollTop = oldBody ? oldBody.scrollTop : 0;
      const tmp = document.createElement('div');
      tmp.innerHTML = renderDetailModal();
      const newDetail = tmp.querySelector('.detail-modal');
      if (newDetail) {
        existingDetail.innerHTML = newDetail.innerHTML;
        const newBody = existingDetail.querySelector('.detail-body');
        if (newBody) newBody.scrollTop = savedScrollTop;
        attachListeners();
        syncConfirmModalHost();
        syncScannerStream();
        return;
      }
    }
  }

  // ── Full re-render for everything else ───────────────────────────
  // Capture scroll positions of every scrollable container BEFORE we blow
  // away root.innerHTML, then restore them on the freshly-rendered nodes
  // so the page/modal doesn't jump back to the top on every click.
  const scrollMap = captureScrollPositions(root);

  if (state.screen === 'login') {
    root.innerHTML = renderLogin();
  } else if (state.route === 'admin') {
    root.innerHTML = renderAdmin();
  } else {
    root.innerHTML = renderApp();
  }
  attachListeners();
  syncConfirmModalHost();
  syncScannerStream();
  restoreScrollPositions(root, scrollMap);
}

// Selectors for every scrollable container in the app. Each key MUST resolve
// to at most one element on the page (we use querySelector, not All). Add new
// scroll containers here when introducing new modals/panels.
const SCROLL_TARGETS = [
  '.content.scroll',     // Main page body (booking page, my bookings, admin pages)
  '.detail-body.scroll', // Detail modal body (booking/room/blockout/blacklist/audit)
  '.detail-body',        // Detail modal body fallback (in case .scroll class is missing)
  '.sheet-body',         // Booking wizard body (also handled by partial render above)
  '.filter-chips',       // Horizontal-scrolling status chip strip on Manage bookings (mobile)
];

/* Capture BOTH axes — some containers (e.g. the chip strip on the bookings
   filter bar) scroll horizontally, not vertically. Restoring only scrollTop
   would silently reset their scrollLeft to 0 on every re-render. */
function captureScrollPositions(root) {
  const map = {};
  for (const sel of SCROLL_TARGETS) {
    const el = root.querySelector(sel);
    if (el) map[sel] = { top: el.scrollTop, left: el.scrollLeft };
  }
  return map;
}

function restoreScrollPositions(root, map) {
  for (const sel of Object.keys(map)) {
    const el = root.querySelector(sel);
    if (!el) continue;
    const pos = map[sel];
    // Backwards-compat: older captures stored a bare number (scrollTop).
    if (typeof pos === 'number') { el.scrollTop = pos; continue; }
    el.scrollTop  = pos.top  || 0;
    el.scrollLeft = pos.left || 0;
  }
}

/* ────────────────────────────────────────────────────────────────────
   SUPABASE DATA LOADING
   loadAllData() runs once at boot. If `db` is null (keys not set) it
   clears state.loading and lets the app run on its built-in mock data.
──────────────────────────────────────────────────────────────────── */
function rowToBooking(r) {
  return {
    no:      r.no,
    room:    r.room,
    date:    r.date,
    time:    r.time,
    status:  r.status,
    email:   r.email   || '',
    guests:  r.guests  || 0,
    phone:   r.phone   || '',
    contact: (typeof r.contact === 'string' ? JSON.parse(r.contact) : r.contact) || {},
    cart:    (typeof r.cart    === 'string' ? JSON.parse(r.cart)    : r.cart)    || {},
  };
}

function rowToBlockout(r) {
  return { id: r.id, room: r.room, date: r.date, start: r.start || '', end: r.end || '', reason: r.reason || '' };
}

async function loadAllData() {
  if (!db) {
    // Supabase not configured — use built-in demo data, show app immediately.
    state.loading   = false;
    state.loadError = '';
    render();
    return;
  }
  try {
    const [bRes, boRes, blRes, aRes, auRes] = await Promise.all([
      db.from('bookings').select('*').order('created_at', { ascending: false }),
      db.from('blockouts').select('*').order('id',         { ascending: true  }),
      db.from('blacklist').select('*'),
      db.from('admins').select('*'),
      db.from('audit').select('*').order('ts',             { ascending: false }).limit(500),
    ]);

    if (bRes.error)  throw new Error('bookings: '  + bRes.error.message);
    if (boRes.error) throw new Error('blockouts: ' + boRes.error.message);
    if (blRes.error) throw new Error('blacklist: ' + blRes.error.message);
    if (aRes.error)  throw new Error('admins: '    + aRes.error.message);
    if (auRes.error) throw new Error('audit: '     + auRes.error.message);

    api.bookings  = (bRes.data  || []).map(rowToBooking);
    api.blockouts = (boRes.data || []).map(rowToBlockout);
    api.blacklist = (blRes.data || []).map(r => ({ email: r.email, reason: r.reason || '' }));
    api.admins    = (aRes.data  || []).map(r => ({ email: r.email, addedAt: r.added_at || r.addedAt || '' }));
    api.audit     = (auRes.data || []).map(r => ({ ts: r.ts, actor: r.actor, action: r.action, detail: r.detail, result: r.result }));

    // Sync the ADMINS Set used by isAdminUser() with the DB values.
    ADMINS.clear();
    api.admins.forEach(a => ADMINS.add((a.email || '').toLowerCase()));

    state.loading   = false;
    state.loadError = '';
    render();
  } catch (err) {
    console.error('[Supabase] loadAllData failed:', err);
    state.loading   = false;
    state.loadError = err.message || 'Could not connect to the database.';
    render();
  }
}

/* ────────────────────────────────────────────────────────────────────
   SUPABASE WRITE HELPERS
   All async, fire-and-forget — they never block the UI.
   The in-memory api.* arrays are updated first so the UI reflects the
   change immediately; the DB write happens in the background.
   On error: logs to console and shows a warning toast.
──────────────────────────────────────────────────────────────────── */
async function dbInsertBooking(b) {
  if (!db) return;
  const { error } = await db.from('bookings').insert([{
    no: b.no, room: b.room, date: b.date, time: b.time,
    status: b.status, email: b.email, guests: b.guests,
    phone: b.phone, contact: b.contact, cart: b.cart,
  }]);
  if (error) { console.error('[DB] insert booking', error); showToast('Warning: booking may not have saved to database', 'error'); }
}

  if (!db) return;

  if (error) { console.error('[DB] update booking status', error); showToast('Warning: status change may not have saved', 'error'); }
}

/* ── Manage-bookings filtering ────────────────────────────────────────
   Date presets evaluate against today() (the app's mock "now"). The result
   is intentionally inclusive at both ends — a booking on the boundary day
   shows up. Status counts displayed on the chips reflect the *date-filtered*
   set so the numbers always match what a user would see after clicking. */
function bookingsAfterDateFilter() {
  const f = state.adminBookingsFilters || {};
  const t = today();
  return api.bookings.filter(b => {
    let bd;
    try { bd = new Date(b.date); } catch { return true; }
    if (!bd || isNaN(bd.getTime())) return true; // un-parseable date — never hide
    const tStart = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const bdDay  = new Date(bd.getFullYear(), bd.getMonth(), bd.getDate());

    switch (f.date) {
      case 'today':     return sameDay(bdDay, tStart);
      case 'tomorrow':  return sameDay(bdDay, new Date(tStart.getFullYear(), tStart.getMonth(), tStart.getDate()+1));
      case 'this-week': {
        const dow = tStart.getDay();
        const weekStart = new Date(tStart.getFullYear(), tStart.getMonth(), tStart.getDate() - dow);
        const weekEnd   = new Date(tStart.getFullYear(), tStart.getMonth(), tStart.getDate() + (6 - dow));
        return bdDay >= weekStart && bdDay <= weekEnd;
      }
      case 'past':      return bdDay <  tStart;
      case 'all':       return true;
      case 'custom': {
        const from = f.customFrom, to = f.customTo;
        const bdKey = dateKey(bdDay);
        if (from && bdKey < from) return false;
        if (to   && bdKey > to)   return false;
        return true;
      }
      case 'upcoming':
      default:          return bdDay >= tStart;
    }
  });
}

function filteredAdminBookings() {
  const f = state.adminBookingsFilters || {};
  let list = bookingsAfterDateFilter();
  if (f.status && f.status !== 'all') list = list.filter(b => b.status === f.status);
  return list;
}

function renderAdminSchedule() {
  const d = state.scheduleDate || today();
  const t = today();
  const isToday    = sameDay(d, t);
  const isTomorrow = sameDay(d, new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1));
  const dayFmt  = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const yearFmt = d.getFullYear() !== t.getFullYear() ? `, ${d.getFullYear()}` : '';
  const dayLabel = isToday ? `Today · ${dayFmt}` : isTomorrow ? `Tomorrow · ${dayFmt}` : `${dayFmt}${yearFmt}`;

  const dayBookings = api.bookings.filter(b => { try { return sameDay(new Date(b.date), d); } catch { return false; } });
  const rooms = ALL_ROOM_IDS.map(id => ROOMS[id]);
  const HOURS = SLOT_HOURS;

  // Build one row per hour — each row has one chip per room.
  // Priority: blockouts > bookings (with parent-child cascade) > free.
  const tableRows = HOURS.map(h => {
    const chips = rooms.map(r => {
      // 1. Blockouts take precedence — admin-imposed unavailability, with
      //    the same parent-child cascade as bookings.
      const blk = blockoutAffectingRoomAt(r.id, d, h);
      if (blk) {
        const isFullDay = !blk.start && !blk.end;
        const isAll     = blk.room === 'All' || !blk.room;
        const isDirect  = isAll || blk.room === r.name;
        const reason    = blk.reason || (isFullDay ? 'Blocked all day' : 'Blocked');
        // Cascade indicator: show "via [other room]" when not a direct hit.
        const label = isDirect ? reason : `via ${blk.room}`;
        const ttl   = `${reason}${isAll ? ' (all rooms)' : (isDirect ? '' : ` — cascaded from ${blk.room}`)}`;
        return `<button class="sched-chip sched-chip-blockout"
                  data-action="open-blockout" data-id="${escapeHTML(blk.id)}"
                  title="${escapeHTML(ttl)}">
                  <span style="font-size:11px;">⊘</span>
                  <span class="sched-chip-room">${escapeHTML(r.name)}</span>
                  <span class="sched-chip-sep">·</span>
                  <span class="sched-chip-name" style="font-size:11px;">${escapeHTML(label)}</span>
                </button>`;
      }
      // 2. Bookings (with parent-child cascade).
      const bk = bookingAffectingRoomAt(r.id, d, h);
      if (bk) {
        const p = bookingHours(bk);
        const customerName = (bk.contact && bk.contact.name) || bk.email;
        const directlyBooked = bk.room === r.name;
        const isCont = p.sh !== h;

        if (!directlyBooked) {
          // Blocked by parent/child cascade — show "via [other room]" pill
          return `<button class="sched-chip sched-chip-cont ${escapeHTML(bk.status)}"
                    data-action="open-sched-booking" data-no="${escapeHTML(bk.no)}"
                    title="Blocked by ${escapeHTML(bk.room)} booking">
                    <span class="sched-chip-room">${escapeHTML(r.name)}</span>
                    <span class="sched-chip-sep">⟶</span>
                    <span class="sched-chip-name" style="font-size:11px;">via ${escapeHTML(bk.room)}</span>
                  </button>`;
        }
        if (isCont) {
          return `<button class="sched-chip sched-chip-cont ${escapeHTML(bk.status)}"
                    data-action="open-sched-booking" data-no="${escapeHTML(bk.no)}">
                    <span class="sched-chip-room">${escapeHTML(r.name)}</span>
                    <span class="sched-chip-sep">↕</span>
                  </button>`;
        }
        return `<button class="sched-chip ${escapeHTML(bk.status)}"
                  data-action="open-sched-booking" data-no="${escapeHTML(bk.no)}">
                  <span class="sched-chip-dot"></span>
                  <span class="sched-chip-room">${escapeHTML(r.name)}</span>
                  <span class="sched-chip-sep">·</span>
                  <span class="sched-chip-name">${escapeHTML(customerName)}</span>
                </button>`;
      }
      // Free slot — clickable to show room info
      return `<button class="sched-chip sched-chip-free"
                data-action="open-sched-slot" data-room="${escapeHTML(r.id)}" data-hour="${h}">
                <span class="sched-chip-dot" style="width:5px;height:5px;opacity:.4;"></span>
                <span class="sched-chip-room">${escapeHTML(r.name)}</span>
              </button>`;
    }).join('');

    return `<div class="sched-row">
      <div class="sched-row-time">${String(h).padStart(2,'0')}:00 – ${String(h+1).padStart(2,'0')}:00</div>
      <div class="sched-row-rooms">${chips}</div>

/* ─── QR Scanner ────────────────────────────────────────────────────
   The scanner runs at most one camera stream + one rAF loop at a time. State
   lives in two layers:
     - `state.scanner`           — UI state (status text, manual input, etc.)
     - module-local _scannerCtx  — non-UI runtime handles (stream, rAF id…)
   Lifecycle:
     1. open-scanner action  → state.scanner = { status: 'starting' } + render
     2. syncScannerStream()  → called after render, starts camera + rAF loop
     3. rAF tick decodes via jsQR; on a hit, opens the matching booking
     4. close-scanner / open-booking → stopScanner() releases the stream
   The runtime ctx is intentionally separate from `state` so we don't ship
   MediaStream / requestAnimationFrame ids through render(). */
const _scannerCtx = { stream: null, rafId: null, videoEl: null, canvasEl: null, lastHit: 0 };

function renderScannerModal() {
  if (!state.scanner) return '';
  const s = state.scanner;
  const denied      = s.status === 'denied';
  const unsupported = s.status === 'unsupported';
  const statusText  = s.status === 'starting'  ? 'Starting camera…'
                    : s.status === 'scanning'  ? 'Point the camera at a booking QR code'
                    : s.status === 'detected'  ? 'Found a code — opening…'
                    : s.status === 'denied'    ? 'Camera permission denied'
                    : s.status === 'unsupported' ? 'Camera not available on this device'
                    : s.status === 'error'     ? (s.error || 'Camera error') : '';
  const statusKind  = (s.status === 'denied' || s.status === 'unsupported' || s.status === 'error') ? 'error'
                    : s.status === 'detected' ? 'success' : '';

  const stage = (denied || unsupported)
    ? `<div class="scanner-perm-denied">
         ${icon('warn', 22)}
         <div style="margin-top:8px;">${unsupported
           ? 'This browser or device doesn\'t expose camera access. Use the manual input below to look up a booking by number.'
           : 'Allow camera access in your browser settings, then reopen the scanner. You can also enter the booking number manually below.'}</div>
       </div>`
    : `<div class="scanner-stage">
         <video playsinline muted></video>
         <div class="scanner-frame">
           <div class="scanner-frame-box">
             <span class="scanner-frame-corner tl"></span>
             <span class="scanner-frame-corner tr"></span>
             <span class="scanner-frame-corner bl"></span>
             <span class="scanner-frame-corner br"></span>
           </div>
         </div>
       </div>`;

  return `
    <div class="scanner-overlay" data-action="close-scanner">
      <div class="scanner-modal" data-stop="1" role="dialog" aria-modal="true" aria-label="QR scanner">
        <div class="scanner-head">
          <span class="scanner-title">Scan booking QR</span>
          <button class="icon-btn" data-action="close-scanner" aria-label="Close">${icon('close', 16)}</button>
        </div>
        <div class="scanner-body">
          ${stage}
          <div class="scanner-status ${statusKind}">${escapeHTML(statusText)}</div>
          <div class="scanner-fallback">
            <div class="scanner-fallback-label">Or look up by booking number</div>
            <div class="scanner-fallback-row">
              <input type="text" placeholder="RBK-XXXXX" data-scanner-manual value="${escapeHTML(s.manualCode || '')}" aria-label="Booking number"/>
              <button class="btn btn-primary" data-action="scanner-manual-submit">Open</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

/* Called from render() after the DOM is built. Starts/stops the camera to
   match state.scanner. Idempotent — safe to call after every render. */
function syncScannerStream() {
  const wantOpen = !!state.scanner;
  if (!wantOpen) { stopScanner(); return; }

  const status = state.scanner.status;
  if (status === 'denied' || status === 'unsupported') { stopScanner(); return; }

  const video = document.querySelector('.scanner-stage video');
  if (!video) { stopScanner(); return; }

  // Already running on this exact video element → keep going.
  if (_scannerCtx.stream && _scannerCtx.videoEl === video) return;

  stopScanner(); // drop any prior stream before starting a fresh one
  _scannerCtx.videoEl = video;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    state.scanner = { ...state.scanner, status: 'unsupported' };
    render();
    return;
  }

  // Prefer rear-facing camera on phones, fall back to default if denied.
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(stream => {
      // The user may have closed the modal while permission was being granted.
      if (!state.scanner) { stream.getTracks().forEach(t => t.stop()); return; }
      _scannerCtx.stream = stream;
      video.srcObject = stream;
      video.play().catch(() => {});
      state.scanner = { ...state.scanner, status: 'scanning' };
      // Don't re-render — we don't want to recreate the video element.
      const statusEl = document.querySelector('.scanner-status');
      if (statusEl) { statusEl.textContent = 'Point the camera at a booking QR code'; statusEl.className = 'scanner-status'; }
      startDecodeLoop();
    })
    .catch(err => {
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      state.scanner = { ...state.scanner, status: denied ? 'denied' : 'error', error: (err && err.message) || '' };
      render();
    });
}

function startDecodeLoop() {
  if (!_scannerCtx.canvasEl) _scannerCtx.canvasEl = document.createElement('canvas');
  const canvas = _scannerCtx.canvasEl;
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });
  const video  = _scannerCtx.videoEl;

  const tick = () => {
    if (!state.scanner || !_scannerCtx.stream) return;
    _scannerCtx.rafId = requestAnimationFrame(tick);
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
    // Decode at 320px wide for speed — still plenty for a 25×25 QR.
    const w = 320, h = Math.round((video.videoHeight / video.videoWidth) * 320) || 320;
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    if (typeof jsQR !== 'function') return; // library not loaded yet
    const img = ctx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (!code || !code.data) return;
    // Debounce: ignore repeat hits within 1.2s
    const now = Date.now();
    if (now - _scannerCtx.lastHit < 1200) return;
    _scannerCtx.lastHit = now;
    handleScannerHit(code.data);
  };
  _scannerCtx.rafId = requestAnimationFrame(tick);
}

function handleScannerHit(raw) {
  // Accept either a bare booking number ("RBK-…") or a URL/string containing one.
  const m = (raw || '').match(/RBK-[A-Z0-9]+/i);
  const code = m ? m[0].toUpperCase() : (raw || '').trim();
  const booking = api.bookings.find(x => x.no.toUpperCase() === code.toUpperCase());
  if (!booking) {
    state.scanner = { ...state.scanner, status: 'error', error: `No booking found for "${code}"` };
    render();
    return;
  }
  state.scanner = { ...state.scanner, status: 'detected' };
  // Close the scanner and open the booking detail modal in one render pass.
  stopScanner();
  state.scanner = null;
  state.detailModal = { kind: 'booking', record: booking, title: 'Booking detail' };
  render();
}

function stopScanner() {
  if (_scannerCtx.rafId) { cancelAnimationFrame(_scannerCtx.rafId); _scannerCtx.rafId = null; }
  if (_scannerCtx.stream) {
    _scannerCtx.stream.getTracks().forEach(t => { try { t.stop(); } catch {} });
    _scannerCtx.stream = null;
  }
  if (_scannerCtx.videoEl) { try { _scannerCtx.videoEl.srcObject = null; } catch {} }
  _scannerCtx.videoEl = null;
}

/* Body-level mount for the confirmation modal. The modal lives OUTSIDE #root
   in its own <div> appended to <body>, so:
     - It can't be wiped by render()'s partial-re-render fast paths.
     - It can't be trapped inside any ancestor stacking context (transforms,
       filters, will-change on .frame/.sheet/.detail-modal etc.).
     - Its z-index is comparable against the viewport root, not against
       whichever modal opened it.
   Listeners are attached once when the host is created and route into the
   same onClick dispatcher as the main #root tree. */
function syncConfirmModalHost() {
  let host = document.getElementById('confirm-modal-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'confirm-modal-host';
    document.body.appendChild(host);
    host.addEventListener('click', onClick, { once: false });
  }
  const html = state.confirmModal ? renderConfirmModal() : '';
  if (host.innerHTML !== html) host.innerHTML = html;
}

/* Plan §8 — single detail modal that owns the action buttons for any
   admin-list record. Click a row → modal with the per-record actions. */
function renderDetailModal() {
  const m = state.detailModal;
  if (!m) return '';
  const isCreate = m.mode === 'create';
  const body = (
    m.kind === 'booking'   ? bookingDetailBody(m.record) :
    m.kind === 'room'      ? (isCreate ? roomCreateBody() : (m.editing ? roomEditBody(m.record) : roomDetailBody(m.record))) :
    m.kind === 'blockout'  ? (isCreate ? blockoutCreateBody()  : blockoutDetailBody(m.record)) :
    m.kind === 'blacklist' ? (isCreate ? blacklistCreateBody() : blacklistDetailBody(m.record)) :
    m.kind === 'admin'            ? adminAccessCreateBody() :
    m.kind === 'catering-cat'     ? cateringCatBody() :
    m.kind === 'catering-product' ? (m.mode === 'view' ? cateringProductViewBody() : cateringProductBody()) :
    m.kind === 'audit'            ? auditDetailBody(m.record) :
                              ''
  );
  return `
    <div class="sheet-overlay" data-action="close-detail">
      <div class="detail-modal" data-stop="1">
        <div class="detail-head">
          <div class="detail-title">${escapeHTML(m.title || 'Detail')}</div>
          <button class="sheet-close" data-action="close-detail" aria-label="Close">${icon('close', 16)}</button>
        </div>
        <div class="detail-body scroll">${body}</div>
      </div>
    </div>`;
}

function detailRow(label, value, mono) {
  return `<div class="review-row"><span class="label">${escapeHTML(label)}</span><span class="value${mono ? ' mono' : ''}">${escapeHTML(value == null ? '—' : String(value))}</span></div>`;
}

function bookingDetailBody(b) {
  if (!b) return '<div class="empty-row">Booking not found.</div>';
  const isAdmin = state.route === 'admin';
  const isOwner = (b.email || '').toLowerCase() === CURRENT_USER.email.toLowerCase();
  const cancellable = ['submitted', 'booked', 'pending'].includes(b.status);
  // Edit is allowed only for users on their OWN Pending bookings.
  // Once Booked / Checked-In / Completed / Rejected, editing is disabled —
  // the user must contact an admin to change details.
  const editable = !isAdmin && isOwner && b.status === 'submitted';
  const editing  = editable && state.detailModal && state.detailModal.editing === true;

  if (editing) return bookingEditBody(b);

  const contact = b.contact || {};
  const cartEntries = Object.entries(b.cart || {}).map(([pid, qty]) => ({ p: PRODUCTS.find(x => x.id === pid), qty })).filter(x => x.p);
  const cartTotal = cartEntries.reduce((s, x) => s + x.p.price * x.qty, 0);

  // QR card — shown for every booking. Dimmed for cancelled/rejected so a
  // stale code can't grant access. Mobile stacks the QR over the meta block.
  const isStale = ['cancelled', 'rejected'].includes(b.status);
  const qrCard = `
    <div class="booking-qr-card ${isStale ? 'is-stale' : ''}">
      <div class="booking-qr-art">${renderQR(b.no, 120)}</div>
      <div class="booking-qr-meta">
        <div class="booking-qr-no">${escapeHTML(b.no)}</div>
        <div class="booking-qr-row"><span class="label">Room</span><span>${escapeHTML(b.room)}</span></div>
        <div class="booking-qr-row"><span class="label">When</span><span>${escapeHTML(b.date)} · <span class="mono">${escapeHTML(b.time)}</span></span></div>
        <div class="booking-qr-row"><span class="label">Status</span><span><span class="badge ${b.status}"><span class="badge-dot"></span>${badgeLabel(b.status)}</span></span></div>
        <div class="booking-qr-actions">
          <button class="btn btn-secondary" data-action="download-qr" data-no="${escapeHTML(b.no)}">${icon('download', 12)} Download PNG</button>
        </div>
      </div>
    </div>`;

  return `
    ${qrCard}
    <div class="review-block">
      <div class="review-block-title">Booking</div>
      <div class="review-rows">
        ${detailRow('Number', b.no, true)}
        ${detailRow('Status', badgeLabel(b.status))}
        ${detailRow('Room', b.room)}
        ${detailRow('Date', b.date)}
        ${detailRow('Time', b.time, true)}
        ${detailRow('Guests', b.guests)}
      </div>
    </div>
    <div class="review-block">
      <div class="review-block-title">Customer</div>
      <div class="review-rows">
        ${detailRow('Name', contact.name || '—')}
        ${detailRow('Email', b.email, true)}
        ${detailRow('Phone', contact.phone || b.phone, true)}
        ${detailRow('Remarks', contact.remark || '—')}
      </div>
    </div>
    ${CONFIG.cateringEnabled ? `
      <div class="review-block">
        <div class="review-block-title">Catering</div>
        <div class="review-rows">
          ${cartEntries.length === 0
            ? `<div class="review-row"><span class="label">Items</span><span class="value">No catering</span></div>`
            : cartEntries.map(x => `<div class="review-row"><span class="label">${escapeHTML(x.p.name)} × ${x.qty}</span><span class="value mono">฿${(x.p.price * x.qty).toLocaleString()}</span></div>`).join('')
          }
          ${cartEntries.length > 0 ? `<div class="review-row"><span class="label"><strong>Subtotal</strong></span><span class="value mono"><strong>฿${cartTotal.toLocaleString()}</strong></span></div>` : ''}
        </div>
      </div>` : ''}
    ${!isAdmin && isOwner && !editable && cancellable ? `
      <div class="info-banner">
        <span class="info-icon">${icon('info', 16)}</span>
        <div class="info-banner-text">This booking is already <strong>${escapeHTML(badgeLabel(b.status))}</strong>. To change any details, please contact an admin.</div>
      </div>` : ''}
    <div class="detail-actions">
      ${isAdmin ? `
        ${b.status === 'submitted' || b.status === 'pending' ? `<button class="btn btn-primary" data-action="admin-confirm" data-no="${escapeHTML(b.no)}">${icon('check', 14)} Confirm</button>` : ''}
        ${b.status === 'booked' ? `<button class="btn btn-primary" data-action="admin-checkin" data-no="${escapeHTML(b.no)}">${icon('check', 14)} Check-in</button>` : ''}
        ${b.status === 'checked-in' ? `<button class="btn btn-primary" data-action="admin-complete" data-no="${escapeHTML(b.no)}">Mark completed</button>` : ''}
        ${cancellable ? `<button class="btn btn-secondary danger" data-action="admin-reject" data-no="${escapeHTML(b.no)}">Reject</button>` : ''}
      ` : ''}
      ${editable ? `<button class="btn btn-primary" data-action="edit-booking" data-no="${escapeHTML(b.no)}">${icon('settings', 14)} Edit details</button>` : ''}
      ${!isAdmin && isOwner && cancellable ? `<button class="btn btn-secondary danger" data-action="user-cancel" data-no="${escapeHTML(b.no)}">Cancel booking</button>` : ''}
    </div>`;
}

/* Plan §4 — strip per-date slot counts/labels. A cell is either:
   • today           → red bordered square
   • available       → green tint, clickable
   • unavailable     → gray, disabled
   (Full-day blockouts and the non-admin booking window collapse into
   "unavailable" — the user sees one gray state for all of them.) */
function renderDayGrid() {
  const { year, month } = state.view;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);

  const t = today();
  const admin = state.route === 'admin' || isAdminUser(CURRENT_USER.email);
  const minDays = admin ? 0 : CONFIG.nonAdminMinDays;
  const maxDays = admin ? 365 : CONFIG.nonAdminMaxDays;
  const minBookable = new Date(t.getFullYear(), t.getMonth(), t.getDate() + minDays);
  const maxBookable = new Date(t.getFullYear(), t.getMonth(), t.getDate() + maxDays);

  return cells.map(d => {
    if (!d) return `<div class="day-cell empty"></div>`;
    const isToday   = sameDay(d, t);
    const isSelected = sameDay(d, state.selectedDate);
    const outOfRange = d < minBookable || d > maxBookable;
    const fullBlock  = isFullDayBlockout(d);
    const data = generateDayData(d);

    // Compute 4-state availability for dot indicator
    let calState;
    if (outOfRange || fullBlock) {
      calState = 'cal-blocked';
    } else {
      const allSlotStates = ALL_ROOM_IDS.flatMap(id => data[id]);
      const availCount = allSlotStates.filter(s => s === 'available').length;
      const total = allSlotStates.length;
      if (availCount === 0) {
        calState = 'cal-full';
      } else if (total > 0 && availCount / total <= 0.5) {
        calState = 'cal-limited';
      } else {
        calState = 'cal-available';
      }
    }

    const unavailable = calState === 'cal-blocked' || calState === 'cal-full';
    const cls = ['day-cell', calState];
    if (isToday)    cls.push('today');
    if (isSelected) cls.push('selected');

    // Today stays visible even if out of range (red border, no click)
    const disabled = unavailable && !isToday;
    return `<button class="${cls.join(' ')}" ${(disabled || unavailable) ? 'disabled' : ''} data-action="pick-date" data-iso="${d.toISOString()}">
      <span class="day-num">${d.getDate()}</span>
      <span class="cal-dot ${calState}"></span>
    </button>`;
  }).join('');
}

/* ── Booking flow ──────────────────────────────────────────────────
   Step order (plan §1): tc → contact → booking → catering* → summary → completion
   *catering hidden when CONFIG.cateringEnabled === false.
   Milestone bar (plan §3) shows everything except the T&C gate. */
function renderFlow() {
  const f = state.flow;
  const date = state.selectedDate || today();
  const stepName = currentStepName();
  const isTC = stepName === 'tc';
  const isCompletion = stepName === 'completion';
  const dayData = generateDayData(date);
  const slotCount = f.slot ? (f.slot.endIdx - f.slot.startIdx + 1) : 0;
  const room = f.roomId ? ROOMS[f.roomId] : null;
  const cartTotal = Object.entries(f.cart).reduce((sum, [pid, qty]) => {
    const p = PRODUCTS.find(p => p.id === pid);
    return sum + (p ? p.price * qty : 0);
  }, 0);
  const roomCharge = (f.slot && room) ? room.rate * slotCount : 0;

  const canNext = canProceed();
  const isSummary = stepName === 'summary';

  const stepBody = (
    stepName === 'tc'         ? renderStepTC() :
    stepName === 'contact'    ? renderStepContact() :
    stepName === 'booking'    ? renderStepBooking(date, dayData) :
    stepName === 'catering'   ? renderStepCatering() :
    stepName === 'summary'    ? renderStepReview(date, room, roomCharge, cartTotal) :
    stepName === 'completion' ? renderStepCompletion(date, room) :
                                ''
  );

  return `
    <div class="sheet-overlay" data-action="${isCompletion ? 'noop' : 'close-flow'}">
      <div class="sheet" data-stop="1">
        <div class="sheet-head">
          <div class="sheet-head-row">
            ${isCompletion ? `<div class="sheet-head-side"></div>` : `
              <div class="sheet-head-side">
                <button class="sheet-back-btn" data-action="flow-back">
                  ${icon(state.flow.step === 0 ? 'close' : 'back', 15)}
                  <span>${state.flow.step === 0 ? 'Cancel' : 'Back'}</span>
                </button>
              </div>`}
            <div class="sheet-title">
              <div class="sheet-title-date">${date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
              ${f.slot ? `<div class="sheet-title-time">${SLOT_LABELS[f.slot.startIdx]} – ${String(SLOT_HOURS[f.slot.endIdx]+1).padStart(2,'0')}:00 · ${slotCount}h</div>` : ''}
            </div>
            <div class="sheet-head-side"></div>
          </div>
          ${isTC ? '' : renderMilestoneBar()}
        </div>

        <div class="sheet-body">${stepBody}</div>

        ${!isCompletion ? `
        <div class="sheet-foot">
          <div class="foot-summary">
            ${(stepName !== 'tc' && room && f.slot) ? `
              <span class="foot-summary-line">${escapeHTML(room.name)} · ${slotCount}h</span>
              <span class="foot-summary-total">฿${(roomCharge + cartTotal).toLocaleString()}</span>` : ''}
          </div>
          ${state.flow.step > 0 ? `<button class="btn btn-secondary" data-action="flow-back">Back</button>` : ''}
          <button class="btn btn-primary" data-action="flow-next" ${canNext ? '' : 'disabled'}>
            ${isSummary ? `${icon('check', 16)} Submit booking` : `Continue ${icon('forward', 16)}`}
          </button>
        </div>` : ''}
      </div>
    </div>`;
}

function renderMilestoneBar() {

  return `<div class="milestones">${steps.map((sid, i) => {
    const meta = STEP_META[sid];

    const stepHtml = `
      <div class="ms-step ${stateName}">
        <div class="ms-circle">${stateName === 'done' ? icon('check', 16, 2.2) : `<span class="ms-num">${i+1}</span>`}</div>
        <div class="ms-text">
          <div class="ms-label">${escapeHTML(meta.label)}</div>
          <div class="ms-sub">${escapeHTML(meta.sub)}</div>

    const lineHtml = (i < steps.length - 1) ? `<div class="ms-line ${i < cur ? 'done' : ''}"></div>` : '';

/* Step: booking info — attendees, slot, room (plan §1, §2) */
function renderStepBooking(date, dayData) {
  const f = state.flow;
  const agg = SLOT_HOURS.map((_, i) => {
    // For aggregated slot status, look across all rooms that match the
    // current guest count. With no guest count yet, fall back to "any room".
    const ids = f.guests != null ? roomsForGuests(f.guests) : ALL_ROOM_IDS;
    const states = ids.map(id => dayData[id][i]);
    if (states.includes('available')) return 'available';
    if (states.includes('submitted')) return 'submitted';
    if (states.includes('blocked')) return 'blocked';
    return 'occupied';
  });

  const candidateRooms = ALL_ROOM_IDS.map(rid => {
    const r = ROOMS[rid];
    let slotFree = true;
    if (f.slot) {
      const arr = dayData[rid];
      for (let i = f.slot.startIdx; i <= f.slot.endIdx; i++) if (arr[i] !== 'available') { slotFree = false; break; }
    }
    const capacityOk = f.guests !== null ? (f.guests >= r.minCap && f.guests <= r.maxCap) : false;
    return { ...r, enabled: capacityOk && slotFree, slotFree, capacityOk };
  });
  const noRoomsAvailable = f.guests !== null && f.slot && candidateRooms.every(r => !r.enabled);

  const slotsHTML = SLOT_HOURS.map((h, i) => {
    const st = agg[i];
    const inRange = f.slot && i >= f.slot.startIdx && i <= f.slot.endIdx;
    const cls = inRange ? 'slot-btn slot-inrange' : `slot-btn slot-${st}`;
    const label = st === 'available' ? 'Free' : st === 'occupied' ? 'Taken' : st === 'submitted' ? 'Pending' : 'Blocked';
    return `<button class="${cls}" ${st !== 'available' ? 'disabled' : ''} data-action="pick-slot" data-idx="${i}">
      <span class="slot-time">${SLOT_LABELS[i]}</span>
      <span class="slot-status">${label}</span>
    </button>`;
  }).join('');

  const slotMetaRight = f.slot
    ? `${SLOT_LABELS[f.slot.startIdx]} – ${String(SLOT_HOURS[f.slot.endIdx]+1).padStart(2,'0')}:00 · ${(f.slot.endIdx - f.slot.startIdx + 1)}h`
    : '';

  const counterVal = f.guests !== null ? f.guests : 1;
  const guestsHint = f.guests === null
    ? 'Enter a number to auto-filter available rooms'
    : f.guests >= 8 ? 'Combined suite required (8–16)' : 'Studio size available (1–7)';

  return `
    <div class="step-stack">
      <div>
        <h2 class="step-h">Pick a room &amp; time</h2>
        <p class="step-sub">${escapeHTML(date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))}</p>
      </div>

      <div>
        <div class="section-label"><span class="section-label-text">Number of participants</span></div>
        <div class="guests-card ${f.errors.guests ? 'error' : ''}">
          <div class="guests-meta">
            <div class="guests-title">Participants</div>
            <div class="guests-hint">${escapeHTML(guestsHint)}</div>
          </div>
          <div class="counter">
            <button class="counter-btn" data-action="guests-dec" ${counterVal <= 1 ? 'disabled' : ''}>${icon('minus', 16)}</button>
            <div class="counter-val">${counterVal}</div>
            <button class="counter-btn" data-action="guests-inc" ${counterVal >= 16 ? 'disabled' : ''}>${icon('plus', 16)}</button>
          </div>
        </div>
        ${f.errors.guests ? `<div class="err-text">${icon('warn', 13)} ${escapeHTML(f.errors.guests)}</div>` : ''}
      </div>

      <div>
        <div class="section-label"><span class="section-label-text">Time range</span></div>
        <div class="slot-meta">
          <div class="left">9 slots · 1 hour each · Continuous only</div>
          ${slotMetaRight ? `<div class="right">${slotMetaRight}</div>` : ''}
        </div>
        <div class="slot-grid">${slotsHTML}</div>
        ${f.errors.slot ? `<div class="err-text">${icon('warn', 14)} ${escapeHTML(f.errors.slot)}</div>` : ''}
      </div>

      <div>
        <div class="section-label">
          <span class="section-label-text">Available rooms</span>
          ${f.slot ? `<span class="section-label-hint">${f.slot.endIdx - f.slot.startIdx + 1}h selected</span>` : ''}
        </div>
        ${noRoomsAvailable ? `
          <div class="no-rooms">${icon('warn', 16)} <span>No rooms available for <strong>${f.guests} people</strong> during this time range.</span></div>
        ` : ''}
        <div class="room-list">
          ${candidateRooms.map(r => renderRoomCard(r, f.guests === null)).join('')}
        </div>
        ${f.errors.room ? `<div class="err-text">${icon('warn', 13)} ${escapeHTML(f.errors.room)}</div>` : ''}
      </div>
    </div>`;
}
