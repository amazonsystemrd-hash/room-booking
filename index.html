<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Roomline · Co-working room booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- jsQR (MIT) — decodes QR codes from getUserMedia video frames. Used by the
     admin scanner modal. ~43KB minified, loaded once on page load. -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<!-- Supabase JS SDK v2 — database client. Loaded synchronously (no defer) so
     the db client is available before any app code runs. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ─── Design tokens (Cool minimal) ──────────────────────────────── */
  :root {
    --bg: oklch(0.985 0.003 240);
    --surface: #ffffff;
    --surface-2: oklch(0.965 0.004 240);
    --surface-3: oklch(0.945 0.005 240);
    --overlay: rgba(15, 22, 36, 0.42);

    --border: oklch(0.92 0.005 240);
    --border-strong: oklch(0.86 0.006 240);
    --divider: oklch(0.94 0.005 240);

    --text: oklch(0.22 0.018 240);
    --text-muted: oklch(0.50 0.012 240);
    --text-subtle: oklch(0.65 0.010 240);
    --text-inverse: #ffffff;

    --accent: #0c1322;
    --accent-hover: #1a2236;
    --accent-active: #060a14;
    --accent-soft: #eef0f4;
    --accent-fg: #ffffff;

    --available: oklch(0.72 0.10 155);
    --available-bg: oklch(0.96 0.04 155);
    --occupied: oklch(0.62 0.16 25);
    --occupied-bg: oklch(0.96 0.03 25);
    --blocked: oklch(0.78 0.005 240);
    --blocked-bg: oklch(0.95 0.003 240);
    --submitted: oklch(0.78 0.13 85);
    --submitted-bg: oklch(0.97 0.05 85);

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 32px;
    --space-8: 40px;
    --space-9: 56px;

    --r-1: 4px;
    --r-2: 8px;
    --r-3: 12px;
    --r-4: 16px;
    --r-full: 999px;

    --shadow-sm: 0 1px 2px rgba(15, 22, 36, 0.04), 0 0 0 1px var(--border);
    --shadow-md: 0 4px 16px rgba(15, 22, 36, 0.06), 0 0 0 1px var(--border);
    --shadow-lg: 0 16px 48px rgba(15, 22, 36, 0.12), 0 2px 6px rgba(15, 22, 36, 0.04);
    --shadow-xl: 0 28px 80px rgba(15, 22, 36, 0.22), 0 4px 12px rgba(15, 22, 36, 0.06);

    --font-ui: "Helvetica Neue", Helvetica, "Arial", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --letter-tight: -0.012em;
    --letter-display: -0.022em;
    --letter-wide: 0.04em;

    --topbar-h: 56px;
    --nav-w: 260px;
  }

  /* ─── Reset & base ────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-ui);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  h1, h2, h3, h4, p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; text-decoration: none; }

  /* Hide scrollbar but allow scroll */
  .scroll { overflow-y: auto; scrollbar-width: thin; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  .mono { font-family: var(--font-mono); font-feature-settings: "ss01", "cv01"; letter-spacing: 0; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-1);
  }

  /* ─── Keyframes ───────────────────────────────────────────────── */
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slide-up { from { transform: translateY(40px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  @keyframes pop { from { transform: scale(.96); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
  @keyframes slide-right { from { transform: translateX(-100%); } to { transform: translateX(0); } }

  /* ─── Root layout (single SPA root) ───────────────────────────── */
  #root { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; }

  /* ─── Logo ───────────────────────────────────────────────────── */
  .logo { display: inline-flex; align-items: center; gap: 10px; }
  .logo-mark { width: 28px; height: 28px; flex: 0 0 28px; }
  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-name { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .logo-sub { font-size: 10.5px; color: var(--text-subtle); letter-spacing: var(--letter-wide); margin-top: 3px; text-transform: uppercase; }

  /* ─── Buttons ────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--space-2); border: 1px solid transparent;
    font-weight: 500; letter-spacing: -0.005em;
    transition: background .15s, border-color .15s, color .15s, transform .05s, box-shadow .15s;
    white-space: nowrap; user-select: none;
    height: 44px; padding: 0 18px; font-size: 14.5px; border-radius: var(--r-2);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .btn-lg { height: 52px; padding: 0 22px; font-size: 15px; }
  .btn-full { width: 100%; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn-primary:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn-secondary:not(:disabled):hover { background: var(--surface-2); border-color: var(--text); }
  .btn-ghost { background: transparent; color: var(--text); }
  .btn-ghost:not(:disabled):hover { background: var(--surface-2); }
  .btn:active:not(:disabled) { transform: translateY(0.5px); }

  /* ─── Login screen ───────────────────────────────────────────── */
  .login {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    display: grid; background: var(--bg);
  }
  .login-left {
    position: relative; overflow: hidden;
    background: var(--text); color: white;
    display: flex; flex-direction: column; padding: var(--space-7);
  }
  .login-left-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 80% 110%, oklch(0.30 0.04 200) 0%, transparent 55%);
  }
  .login-left-pattern {
    position: absolute; inset: 32px;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.04) 18px, rgba(255,255,255,0.07) 18px, rgba(255,255,255,0.07) 36px);
    border-radius: var(--r-3); border: 1px solid rgba(255,255,255,0.06);
  }
  .login-left-dashed {
    position: absolute; top: 64px; left: 64px; right: 64px; bottom: 64px;
    border: 1px dashed rgba(255,255,255,0.18); border-radius: var(--r-2);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,0.55); letter-spacing: 0.4px;
  }
  .login-left-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  .login-left .logo-name { color: white; }
  .login-left .logo-sub { color: rgba(255,255,255,0.55); }
  .login-eyebrow { font-size: 11.5px; font-weight: 500; letter-spacing: var(--letter-wide); color: rgba(255,255,255,0.55); text-transform: uppercase; }
  .login-headline { font-size: 44px; font-weight: 500; letter-spacing: var(--letter-display); line-height: 1.1; margin-top: 12px; color: white; }
  .login-headline em { color: rgba(255,255,255,0.6); font-style: italic; }
  .login-lede { color: rgba(255,255,255,0.65); font-size: 15px; margin-top: 16px; line-height: 1.6; max-width: 420px; }
  .login-features { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .login-features li { display: flex; gap: 10px; align-items: center; color: rgba(255,255,255,0.78); font-size: 13.5px; }
  .login-check {
    width: 18px; height: 18px; flex: 0 0 18px; border-radius: 999px; background: rgba(255,255,255,0.10);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .login-footer { margin-top: 32px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.4); }
  .login-right {
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-7); background: var(--bg);
  }
  .login-right-inner { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: var(--space-5); }
  .login-card-eyebrow { font-size: 11.5px; font-weight: 500; letter-spacing: var(--letter-wide); color: var(--text-subtle); text-transform: uppercase; }
  .login-card-title { font-size: 28px; font-weight: 500; letter-spacing: var(--letter-display); margin-top: 6px; line-height: 1.2; }
  .login-card-text { color: var(--text-muted); font-size: 14px; margin-top: 8px; line-height: 1.55; }

  .google-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
    height: 52px; padding: 0 22px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--r-2);
    font-family: inherit; font-size: 15px; font-weight: 500; letter-spacing: -0.005em;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .05s;
    box-shadow: var(--shadow-sm); position: relative;
  }
  .google-btn:not(:disabled):hover { background: var(--surface-2); border-color: var(--text); }
  .google-btn:disabled { cursor: wait; }
  .spinner { width: 18px; height: 18px; border-radius: 999px; border: 2px solid var(--border-strong); border-top-color: var(--text); animation: spin .8s linear infinite; display: inline-block; }

  .divider-with-note {
    display: flex; align-items: center; gap: 12px; color: var(--text-subtle);
    font-size: 11.5px; letter-spacing: var(--letter-wide); text-transform: uppercase;
  }
  .divider-line { flex: 1; height: 1px; background: var(--divider); }

  .info-card {
    padding: var(--space-4); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-2); display: flex; gap: 12px; align-items: flex-start;
  }
  .info-card .info-icon { color: var(--accent); margin-top: 1px; flex: 0 0 auto; display: flex; }
  .info-card-text { font-size: 12.5px; line-height: 1.55; color: var(--text-muted); }
  .info-card-text strong { color: var(--text); font-weight: 500; }

  .trouble-btn { color: var(--text-muted); font-size: 13px; padding: 4px; align-self: flex-start; }
  .trouble-btn:hover { color: var(--text); }

  .legal-links { display: flex; flex-wrap: wrap; align-items: center; column-gap: 4px; row-gap: 2px; font-size: 12px; color: var(--text-subtle); line-height: 1.5; }
  .legal-links a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; text-decoration-thickness: 1px; font-weight: 500; }
  .legal-links a:hover { text-decoration-color: var(--text); }

  .error-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: var(--space-3) var(--space-4);
    background: var(--occupied-bg); border: 1px solid oklch(0.88 0.05 25);
    border-radius: var(--r-2); color: oklch(0.32 0.10 25); font-size: 12.5px; line-height: 1.5;
  }
  .error-row strong { font-weight: 500; }

  /* Login mobile layout */
  .login.mobile {
    display: flex; flex-direction: column;
    padding: 20px 20px 24px;
  }
  .login.mobile .login-left,
  .login.mobile .login-right { display: none; }
  .login.mobile .login-mobile { display: flex; flex-direction: column; flex: 1; }
  .login.mobile .hero {
    margin-top: 24px; flex: 0 0 auto; height: 200px;
    border-radius: var(--r-3);
    background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 14px, var(--surface-3) 14px, var(--surface-3) 28px);
    border: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .login.mobile .hero-inner {
    position: absolute; inset: 14px; border: 1px dashed var(--border-strong);
    border-radius: var(--r-2); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); letter-spacing: 0.4px;
  }
  .login.mobile .mobile-headline { margin-top: 22px; }
  .login.mobile .mobile-headline h1 { font-size: 26px; font-weight: 500; letter-spacing: var(--letter-display); line-height: 1.12; }
  .login.mobile .mobile-headline h1 em { color: var(--text-muted); font-style: italic; }
  .login.mobile .mobile-headline p { color: var(--text-muted); font-size: 13.5px; margin-top: 10px; line-height: 1.5; }
  .login.mobile .mobile-cta { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .login.mobile .trouble-btn { align-self: center; font-size: 12.5px; }
  .login.mobile .legal-links { justify-content: center; text-align: center; font-size: 11.5px; }
  .login-mobile { display: none; }

  @media (min-width: 880px) {
    .login { grid-template-columns: 1.05fr 1fr; }
    .login-mobile { display: none; }
  }
  @media (max-width: 879px) {
    .login { display: flex; flex-direction: column; padding: 20px 20px 24px; }
    .login-left, .login-right { display: none; }
    .login-mobile { display: flex; flex-direction: column; flex: 1; }
    .login-mobile .hero {
      margin-top: 24px; flex: 0 0 auto; height: 200px;
      border-radius: var(--r-3);
      background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 14px, var(--surface-3) 14px, var(--surface-3) 28px);
      border: 1px solid var(--border); position: relative; overflow: hidden;
    }
    .login-mobile .hero-inner {
      position: absolute; inset: 14px; border: 1px dashed var(--border-strong);
      border-radius: var(--r-2); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); letter-spacing: 0.4px;
    }
    .login-mobile .mobile-headline { margin-top: 22px; }
    .login-mobile .mobile-headline h1 { font-size: 26px; font-weight: 500; letter-spacing: var(--letter-display); line-height: 1.12; }
    .login-mobile .mobile-headline h1 em { color: var(--text-muted); font-style: italic; }
    .login-mobile .mobile-headline p { color: var(--text-muted); font-size: 13.5px; margin-top: 10px; line-height: 1.5; }
    .login-mobile .spacer { flex: 1; min-height: 20px; }
    .login-mobile .mobile-cta { display: flex; flex-direction: column; gap: 10px; }
    .login-mobile .trouble-btn { align-self: center; font-size: 12.5px; }
    .login-mobile .legal-links { justify-content: center; text-align: center; font-size: 11.5px; }
  }

  /* ─── App shell ──────────────────────────────────────────────── */
  .app { width: 100%; height: 100%; background: var(--bg); display: flex; overflow: hidden; }
  .nav {
    width: var(--nav-w); flex: 0 0 var(--nav-w);
    border-right: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column;
    padding: var(--space-5) var(--space-4);
  }
  .nav-header { padding: 0 var(--space-2) var(--space-6); }
  .nav-list { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-radius: var(--r-2); text-align: left;
    background: transparent; color: var(--text-muted);
    font-weight: 400; font-size: 14px;
    transition: background .12s, color .12s; position: relative;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .nav-item .icon { color: var(--text-subtle); }
  .nav-item.active .icon { color: var(--accent); }
  .nav-item-label { flex: 1; }
  .nav-badge { padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 500; }
  .nav-footer { margin-top: auto; padding: var(--space-3) var(--space-2); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 999px; background: oklch(0.85 0.04 60); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: oklch(0.3 0.06 60); }
  .nav-user { flex: 1; min-width: 0; }
  .nav-user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-user-email { font-size: 11px; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  .topbar {
    height: var(--topbar-h); padding: 0 var(--space-5);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); flex: 0 0 auto;
  }
  .topbar-info { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 13px; }
  .topbar-info .sep { color: var(--text-subtle); }
  .topbar-actions { display: flex; align-items: center; gap: 6px; }

  .content { flex: 1; padding: var(--space-7) var(--space-8); }

  .notice {
    display: flex; align-items: flex-start; gap: 12px;
    padding: var(--space-3) var(--space-4);
    background: var(--accent-soft); color: oklch(0.28 0.04 200);
    border: 1px solid oklch(0.86 0.04 200);
    border-radius: var(--r-2); margin-bottom: var(--space-5); font-size: 13px;
  }
  .notice strong { font-weight: 500; }
  .notice-close { background: transparent; padding: 2px; color: inherit; display: flex; }

  .header-block { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .h-eyebrow { font-size: 11.5px; font-weight: 500; letter-spacing: var(--letter-wide); color: var(--text-subtle); text-transform: uppercase; }
  .h-title { font-size: 38px; font-weight: 500; letter-spacing: var(--letter-display); margin-top: 8px; line-height: 1.1; }
  .h-title em { color: var(--text-muted); font-style: italic; }
  .h-text { color: var(--text-muted); font-size: 14.5px; margin-top: 10px; max-width: 520px; line-height: 1.55; }
  .h-actions { display: flex; gap: 8px; }

  .landing-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--space-7); margin-top: var(--space-5); }

  .calendar-card {
    background: var(--surface); border-radius: var(--r-3); border: 1px solid var(--border);
    padding: var(--space-6);
  }
  .calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }
  .calendar-title { font-size: 28px; font-weight: 500; letter-spacing: var(--letter-display); }
  .calendar-title .year { color: var(--text-muted); font-weight: 400; }
  .calendar-sub { font-size: 12.5px; color: var(--text-subtle); margin-top: 4px; }
  .icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-2); display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); }
  .icon-btn:hover { background: var(--surface-2); }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .weekdays div { text-align: center; font-size: 10.5px; font-weight: 500; letter-spacing: 1px; color: var(--text-subtle); }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-cell {
    aspect-ratio: 5 / 4; padding: 8px;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    border-radius: var(--r-2);
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px;
    font-family: inherit; text-align: center; position: relative;
    transition: background .15s, border-color .15s;
  }
  .day-cell:not(:disabled):hover { background: var(--surface-2); }
  .day-cell .day-num { font-family: var(--font-mono); font-size: 17px; font-weight: 500; letter-spacing: 0; }
  /* Disabled day cells — apply a consistent "past date" look: faded
     background, muted number, lower opacity. Covers out-of-range, full-day
     blockouts AND fully-booked in-range days so the user can tell at a glance
     which cells they can't click. */
  .day-cell:disabled {
    cursor: not-allowed;
    background: var(--surface-2);
    color: var(--text-subtle);
    opacity: 0.5;
  }
  .day-cell:disabled .day-num { color: var(--text-subtle); }
  .day-cell.empty { visibility: hidden; border: none; background: transparent; }

  /* Toast notification — fixed bottom-center, fades in, auto-dismisses. */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--text); color: var(--surface);
    padding: 12px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    opacity: 0; transition: opacity .22s ease, transform .22s ease;
    pointer-events: none; z-index: 9999;
    max-width: calc(100vw - 32px);
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.toast-success { background: var(--available, #16a34a); color: #fff; }
  .toast.toast-error   { background: var(--occupied, #dc2626); color: #fff; }
  .toast .icon { color: currentColor; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: var(--space-5); font-size: 11.5px; color: var(--text-muted); }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 999px; }
  .legend-today { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .legend-today-box { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--occupied); }

  .recent-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-3);
    padding: var(--space-5);
  }
  .recent-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-4); }
  .recent-title { font-size: 18px; font-weight: 500; letter-spacing: var(--letter-tight); margin-top: 4px; }
  .view-all { background: transparent; color: var(--text-muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
  .booking-list { display: flex; flex-direction: column; gap: 8px; }
  .booking-row { padding: 12px; border-radius: var(--r-2); border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; transition: background .12s; }
  .booking-row:hover { background: var(--surface-2); }
  .booking-thumb { width: 40px; height: 40px; flex: 0 0 40px; border-radius: var(--r-2); background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
  .booking-meta { flex: 1; min-width: 0; }
  .booking-room { display: flex; align-items: baseline; gap: 8px; }
  .booking-name { font-size: 14px; font-weight: 500; }
  .booking-no { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); }
  .booking-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .recent-footer { margin-top: 14px; padding: 12px; background: var(--surface-2); border-radius: var(--r-2); display: flex; gap: 10px; align-items: flex-start; }
  .recent-footer .icon-accent { color: var(--accent); margin-top: 1px; }
  .recent-footer-text { font-size: 12px; color: var(--text-muted); line-height: 1.55; }

  /* Status badge */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.2px; }
  .badge-dot { width: 6px; height: 6px; border-radius: 999px; }
  .badge.submitted { color: var(--submitted); background: var(--submitted-bg); }
  .badge.submitted .badge-dot { background: var(--submitted); }
  .badge.booked { color: var(--available); background: var(--available-bg); }
  .badge.booked .badge-dot { background: var(--available); }
  .badge.rejected { color: var(--occupied); background: var(--occupied-bg); }
  .badge.rejected .badge-dot { background: var(--occupied); }
  .badge.checked-in { color: var(--accent); background: var(--accent-soft); }
  .badge.checked-in .badge-dot { background: var(--accent); }
  .badge.completed { color: var(--text-muted); background: var(--surface-2); }
  .badge.completed .badge-dot { background: var(--text-muted); }

  /* Mobile bottom bar */
  .mobile-bottom { display: none; padding: var(--space-3) var(--space-4) var(--space-4); background: var(--surface); border-top: 1px solid var(--border); flex: 0 0 auto; box-shadow: 0 -8px 24px rgba(15,22,36,0.04); }
  .mobile-menu { display: none; }

  @media (max-width: 879px) {
    .nav { display: none; }
    .content { padding: var(--space-4); }
    .h-title { font-size: 28px; }
    .h-text { font-size: 13.5px; }
    .h-actions { display: none; }
    .landing-grid { display: flex; flex-direction: column; gap: var(--space-5); }
    .calendar-card { padding: var(--space-4); }
    .calendar-title { font-size: 22px; }
    .day-cell { aspect-ratio: 1 / 1; padding: 4px; gap: 2px; }
    .day-cell .day-num { font-size: 14px; }
    .cal-dot { width: 5px; height: 5px; }
    .topbar-info { display: none; }
    .topbar-actions.desktop-only { display: none; }
    .mobile-menu { display: flex; align-items: center; justify-content: center; padding: 6px; color: var(--text); }
    .mobile-bottom { display: block; }
  }
  @media (min-width: 880px) {
    .mobile-menu { display: none; }
    .mobile-bottom { display: none; }
  }

  /* Mobile nav overlay */
  .nav-overlay {
    position: absolute; inset: 0; background: var(--overlay);
    z-index: 60; display: flex; animation: fade .18s;
  }
  .nav-drawer {
    background: var(--surface); width: 280px; height: 100%;
    display: flex; flex-direction: column; padding: var(--space-5) var(--space-4);
    animation: slide-right .25s cubic-bezier(.2,.7,.2,1);
    box-shadow: 0 0 0 1px var(--border);
  }
  .nav-drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); }

  /* ─── Sheet/modal ────────────────────────────────────────────── */
  .sheet-overlay {
    position: absolute; inset: 0; background: var(--overlay);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; animation: fade .18s ease-out;
  }
  .sheet {
    background: var(--surface);
    width: 640px; max-width: calc(100% - 48px);
    max-height: calc(100% - 80px);
    border-radius: var(--r-4);
    box-shadow: var(--shadow-xl);
    display: flex; flex-direction: column;
    animation: pop .22s cubic-bezier(.2,.7,.2,1);
    overflow: hidden;
  }
  @media (max-width: 879px) {
    .sheet-overlay { align-items: flex-end; }
    .sheet { width: 100%; max-width: 100%; height: calc(100% - 24px); max-height: calc(100% - 24px); border-radius: 20px 20px 0 0; animation: slide-up .26s cubic-bezier(.2,.7,.2,1); }
  }

  .sheet-head {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--divider);
    background: var(--surface);
  }
  .sheet-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-head-side { width: 60px; }
  .sheet-back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px; color: var(--text-muted); font-size: 13px; border-radius: var(--r-1); }
  .sheet-back-btn:hover { color: var(--text); }
  .sheet-title { text-align: center; }
  .sheet-title-date { font-size: 12.5px; font-weight: 500; color: var(--text-muted); }
  .sheet-title-time { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); margin-top: 2px; }
  .sheet-close { display: flex; padding: 4px; color: var(--text-muted); justify-content: flex-end; }

  @media (max-width: 879px) {
    .sheet-head { padding: 16px 18px 14px; }
  }

  /* Milestone stepper */
  .milestones { display: flex; align-items: flex-start; padding: 4px 0; overflow-x: auto; }
  .ms-step { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; min-width: 68px; }
  .ms-circle {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px;
    background: var(--surface-2); border: 2px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-subtle); transition: background .2s, border-color .2s, color .2s;
  }
  .ms-step.active .ms-circle { background: var(--accent); border-color: var(--accent); color: white; }
  .ms-step.done .ms-circle { background: var(--available); border-color: var(--available); color: white; }
  .ms-num { font-family: var(--font-mono); font-size: 14px; font-weight: 600; line-height: 1; }
  .ms-text { text-align: center; }
  .ms-label { font-size: 11.5px; font-weight: 500; color: var(--text-subtle); white-space: nowrap; transition: color .2s; }
  .ms-sub { font-size: 10.5px; color: var(--text-subtle); margin-top: 1px; white-space: nowrap; transition: color .2s; }
  .ms-step.active .ms-label { font-weight: 600; color: var(--text); }
  .ms-step.active .ms-sub { color: var(--accent); }
  .ms-step.done .ms-label { color: var(--text-muted); }
  .ms-line { flex: 1; height: 2px; margin-top: 17px; min-width: 16px; background: var(--border); transition: background .2s; }
  .ms-line.done { background: var(--available); }

  /* Sheet body & footer */
  .sheet-body { flex: 1; padding: 24px 28px 28px; overflow-y: auto; }
  @media (max-width: 879px) { .sheet-body { padding: 20px 18px 24px; } }
  .sheet-foot { padding: 16px 28px; border-top: 1px solid var(--divider); background: var(--surface); display: flex; gap: 12px; align-items: center; }
  @media (max-width: 879px) { .sheet-foot { padding: 12px 18px 16px; } }
  .foot-summary { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .foot-summary-line { font-size: 12.5px; font-weight: 500; color: var(--text); }
  .foot-summary-total { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }

  /* Step sections */
  .step-h { font-size: 22px; font-weight: 500; letter-spacing: var(--letter-display); line-height: 1.15; }
  .step-sub { color: var(--text-muted); font-size: 13.5px; margin-top: 6px; }
  .step-stack { display: flex; flex-direction: column; gap: 28px; }
  .step-stack-tight { display: flex; flex-direction: column; gap: 22px; }
  .section-label { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-3); }
  .section-label-text { font-size: 11.5px; font-weight: 500; letter-spacing: var(--letter-wide); color: var(--text-muted); text-transform: uppercase; }
  .section-label-hint { font-size: 12px; color: var(--text-subtle); }

  /* Slot picker */
  .slot-meta { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-3); }
  .slot-meta .left { font-size: 13px; color: var(--text-muted); }
  .slot-meta .right { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot-btn { padding: 12px 10px; border-radius: var(--r-2); border: 1px solid; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; transition: background .15s, border-color .15s; }
  .slot-btn:disabled { cursor: not-allowed; opacity: 0.85; }
  .slot-time { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; }
  .slot-status { font-size: 10.5px; opacity: 0.85; text-transform: capitalize; letter-spacing: 0.2px; }
  .slot-avail { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
  .slot-avail:hover { background: var(--surface-2); }
  .slot-occupied { background: var(--occupied-bg); border-color: var(--occupied-bg); color: var(--occupied); }
  .slot-submitted { background: var(--submitted-bg); border-color: var(--submitted-bg); color: oklch(0.45 0.10 70); }
  .slot-blocked { background: var(--blocked-bg); border-color: var(--blocked-bg); color: var(--text-subtle); }
  .slot-inrange { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-fg) !important; }
  .err-text { color: var(--occupied); font-size: 12.5px; display: flex; align-items: center; gap: 6px; margin-top: 12px; }

  /* Counter card */
  .guests-card { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--surface-2); border-radius: var(--r-2); border: 1px solid var(--border); }
  .guests-card.error { border-color: var(--occupied); }
  .guests-meta { flex: 1; }
  .guests-title { font-size: 14.5px; font-weight: 500; }
  .guests-hint { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .counter { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-2); overflow: hidden; background: var(--surface); }
  .counter-btn { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .counter-btn:disabled { color: var(--text-subtle); cursor: not-allowed; }
  .counter-val { min-width: 42px; text-align: center; font-family: var(--font-mono); font-size: 16px; font-weight: 500; }

  /* Room cards */
  .room-list { display: flex; flex-direction: column; gap: 10px; }
  .room-card {
    padding: 14px 16px; border-radius: var(--r-2); border: 1.5px solid var(--border-strong);
    background: var(--surface); text-align: left; color: var(--text);
    display: flex; gap: 14px; align-items: flex-start;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .room-card:not(:disabled):hover { background: var(--surface-2); }
  .room-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .room-card.selected:hover { background: var(--accent-soft); }
  .room-card:disabled { background: var(--surface-2); border-color: var(--border); opacity: 0.6; cursor: not-allowed; }
  .room-thumb {
    width: 56px; height: 56px; flex: 0 0 56px; border-radius: var(--r-2);
    background: repeating-linear-gradient(135deg, var(--surface-3), var(--surface-3) 6px, var(--surface-2) 6px, var(--surface-2) 12px);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .room-card:disabled .room-thumb { color: var(--text-subtle); }
  .room-body { flex: 1; min-width: 0; }
  .room-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .room-name { font-size: 15px; font-weight: 500; }
  .room-rate { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); flex: 0 0 auto; }
  .room-cap { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .room-blurb { font-size: 12px; color: var(--text-subtle); margin-top: 5px; line-height: 1.45; }
  .room-chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; color: var(--text-subtle); background: var(--surface-3); }
  .chip.warn { color: var(--occupied); background: var(--occupied-bg); }
  .room-check { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 2px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; }

  .no-rooms { padding: 12px 14px; margin-bottom: 12px; border-radius: var(--r-2); background: var(--occupied-bg); border: 1px solid oklch(0.88 0.05 25); color: var(--occupied); font-size: 13px; display: flex; align-items: center; gap: 8px; }

  /* Field / Input */
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field-label { font-size: 12.5px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.2px; display: inline-flex; justify-content: space-between; align-items: baseline; }
  .field-optional { font-weight: 400; color: var(--text-subtle); }
  .field-hint { font-size: 12px; color: var(--text-subtle); }
  .field-error { font-size: 12px; color: var(--occupied); }
  .input-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--r-2); padding: 0 14px; height: 46px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap.error { border-color: var(--occupied); }
  .input-wrap .icon { color: var(--text-subtle); display: flex; }
  .input-wrap input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; color: var(--text); padding: 12px 0; }
  .input-wrap:has(textarea) { height: auto; min-height: 46px; align-items: flex-start; padding: 12px 14px; }
  .input-wrap textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: var(--text); resize: vertical; padding: 0; line-height: 1.55; overflow: hidden; }

  /* Custom dropdown — replaces native <select> for a modern look that
     matches the input-wrap. Open popup styled in CSS so it looks the
     same across OSes (no Windows highlight). */
  .dropdown { position: relative; }
  .dropdown-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--r-2); padding: 0 14px; height: 46px; width: 100%;
    font: inherit; font-size: 15px; color: var(--text);
    cursor: pointer; text-align: left;
    transition: border-color .15s, box-shadow .15s;
  }
  .dropdown-trigger:hover { border-color: var(--text-subtle); }
  .dropdown-trigger.open,
  .dropdown-trigger:focus-visible { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 3px var(--accent-soft); }
  .dropdown-trigger.error { border-color: var(--occupied); }
  .dropdown-trigger:disabled { cursor: not-allowed; opacity: 0.6; background: var(--surface-2); }
  .dropdown-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dropdown-value.placeholder { color: var(--text-subtle); }
  .dropdown-chevron { color: var(--text-subtle); flex: 0 0 auto; transition: transform .18s; display: flex; }
  .dropdown-trigger.open .dropdown-chevron { transform: rotate(180deg); }
  .dropdown-popup {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-2); padding: 6px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
    z-index: 100; max-height: 280px; overflow-y: auto;
    animation: dropdown-in .14s ease;
  }
  @keyframes dropdown-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .dropdown-option {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 10px 12px; border: 0; background: transparent;
    border-radius: var(--r-1, 8px); cursor: pointer;
    font: inherit; font-size: 14.5px; color: var(--text); text-align: left;
    transition: background .12s;
  }
  .dropdown-option:hover { background: var(--surface-2); }
  .dropdown-option.selected { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .dropdown-option .dropdown-check { color: var(--accent); display: none; }
  .dropdown-option.selected .dropdown-check { display: inline-flex; }
  .dropdown-option-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .info-banner {
    display: flex; gap: 12px; padding: 14px 16px;
    background: var(--accent-soft); border-radius: var(--r-2);
    border: 1px solid oklch(0.86 0.04 200);
  }
  .info-banner .info-icon { color: var(--accent); margin-top: 1px; flex: 0 0 auto; display: flex; }
  .info-banner-text { font-size: 12.5px; line-height: 1.55; color: oklch(0.28 0.04 200); }

  /* Review */
  .review-block { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); }
  .review-block-title { font-size: 10.5px; font-weight: 600; letter-spacing: var(--letter-wide); color: var(--text-subtle); text-transform: uppercase; margin-bottom: 12px; }
  .review-rows { display: flex; flex-direction: column; gap: 10px; }
  .review-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13.5px; }
  .review-row .label { color: var(--text-muted); flex: 0 0 auto; }
  .review-row .value { color: var(--text); font-weight: 500; text-align: right; }

  .collapse {
    border: 1px solid var(--border); border-radius: var(--r-2); overflow: hidden;
  }
  .collapse-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface);
  }
  .collapse-head:hover { background: var(--surface-2); }
  .collapse-left { display: flex; align-items: center; gap: 8px; }
  .collapse-chip { padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 500; }
  .collapse-body { padding: 0 14px 14px; border-top: 1px solid var(--divider); }
  .cat-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: var(--r-2); margin: 12px 0 10px; overflow-x: auto; }
  .cat-tab { padding: 7px 12px; border-radius: var(--r-1); background: transparent; color: var(--text-muted); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
  .cat-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .prod-list { display: flex; flex-direction: column; gap: 6px; }
  .prod-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-2); background: var(--surface); border: 1px solid var(--border); }
  .prod-meta { flex: 1; min-width: 0; }
  .prod-name { font-size: 13.5px; font-weight: 500; }
  .prod-desc { font-size: 11.5px; color: var(--text-subtle); margin-top: 1px; }
  .prod-price { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); margin-right: 8px; }
  .qty-pill { display: inline-flex; align-items: center; gap: 6px; }
  .qty-btn { width: 26px; height: 26px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text); }
  .qty-btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
  .qty-val { font-family: var(--font-mono); min-width: 16px; text-align: center; font-size: 13px; font-weight: 500; }
  .qty-add { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text); }

  .summary-rows { padding: 8px 16px 12px; border-top: 1px solid var(--divider); display: flex; flex-direction: column; gap: 4px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
  .summary-row .price { font-family: var(--font-mono); }

  .totals { border-top: 1px dashed var(--border-strong); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .total-final { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; padding: 12px 0 2px; border-top: 1px solid var(--border); }
  .total-label { font-size: 14px; font-weight: 500; }
  .total-amount { font-family: var(--font-mono); font-size: 24px; font-weight: 500; letter-spacing: var(--letter-display); }
  .totals .footnote { font-size: 11.5px; color: var(--text-subtle); line-height: 1.5; }

  /* Completion */
  .done-stack { display: flex; flex-direction: column; align-items: center; gap: 22px; padding-bottom: 8px; }
  .done-banner {
    width: 100%; padding: 14px 18px; background: var(--available-bg);
    border: 1px solid var(--available); border-radius: var(--r-2);
    display: flex; align-items: center; gap: 12px;
  }
  .done-check { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 999px; background: var(--available); color: white; display: flex; align-items: center; justify-content: center; }
  .done-title { font-size: 14px; font-weight: 600; color: oklch(0.28 0.08 155); }
  .done-msg { font-size: 12.5px; color: oklch(0.38 0.07 155); margin-top: 2px; }
  .qr-wrap { text-align: center; }
  .qr-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
  .qr-box { padding: 16px; background: white; border-radius: var(--r-3); box-shadow: var(--shadow-md); display: inline-block; }
  .bn-label { font-size: 11px; color: var(--text-subtle); letter-spacing: var(--letter-wide); text-transform: uppercase; margin-bottom: 4px; margin-top: 14px; }
  .bn-val { font-family: var(--font-mono); font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .done-summary { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--surface-2); border-radius: var(--r-2); border: 1px solid var(--border); }
  .done-actions { display: flex; gap: 10px; width: 100%; }
  .done-actions .btn { flex: 1; }

  /* Icons inline base */
  .icon { display: inline-flex; }
  .icon svg { display: block; }

  /* ── Calendar palette: 4-state dot indicators ────────────────── */
  /* blocked = out-of-range or full-day blockout → grayed cell, no dot */
  .day-cell.cal-blocked { background: var(--surface-2); color: var(--text-subtle); }
  .day-cell.cal-blocked .day-num { color: var(--text-subtle); }
  /* full = in range but zero available slots → grayed, red dot */
  .day-cell.cal-full { background: var(--surface-2); color: var(--text-subtle); }
  .day-cell.cal-full .day-num { color: var(--text-subtle); }
  /* limited = ≤ 50% slots available → normal cell, amber dot */
  .day-cell.cal-limited:not(:disabled):hover { background: var(--surface-2); }
  /* available = > 50% slots open → normal cell, green dot */
  .day-cell.cal-available:not(:disabled):hover { background: var(--surface-2); }
  /* Today ring (overrides other backgrounds when combined) */
  .day-cell.today { border-color: var(--occupied); border-width: 2px; box-shadow: inset 0 0 0 1px var(--occupied); background: var(--surface); }
  .day-cell.today .day-num { color: var(--occupied); font-weight: 700; }
  /* Selected accent */
  .day-cell.selected { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-fg) !important; box-shadow: none; }
  .day-cell.selected .day-num { color: var(--accent-fg) !important; }
  /* Availability dot inside each day cell */
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cal-dot.cal-available { background: var(--available); }
  .cal-dot.cal-limited  { background: var(--submitted); }
  .cal-dot.cal-full     { background: var(--occupied); }
  .cal-dot.cal-blocked  { display: none; }
  .day-cell.selected .cal-dot { background: rgba(255,255,255,0.75); }
  /* Legend dot indicators (round) */
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.cal-available { background: var(--available); }
  .legend-dot.cal-limited   { background: var(--submitted); }
  .legend-dot.cal-full      { background: var(--occupied); }
  .legend-dot.cal-blocked   { background: var(--blocked); }

  /* ── Plan §7 user chip ────────────────────────────────────────── */
  .user-chip { display: inline-flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-full); }
  .user-chip .avatar { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; }
  .user-chip .nav-user { display: flex; flex-direction: column; line-height: 1.15; }
  .user-chip .nav-user-name { font-size: 12.5px; font-weight: 500; }
  .user-chip .nav-user-email { font-size: 11px; color: var(--text-subtle); }
  .user-chip-admin { margin-left: 6px; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; color: var(--text-muted); background: var(--surface-2); }
  .user-chip-admin:hover { color: var(--text); background: var(--accent-soft); }

  /* Mobile bottom bar: user chip permanently on the left, CTA grows right.
     Per plan §7 the chip must NOT overlap or be covered when window resizes. */
  .mobile-bottom { display: none; }
  @media (max-width: 879px) {
    .mobile-bottom { display: flex !important; align-items: center; gap: 10px; }
    .user-chip.mobile { flex: 0 0 auto; max-width: 60%; overflow: hidden; }
    .user-chip.mobile .nav-user-email { display: none; }
    .btn-grow { flex: 1; }
  }
  @media (min-width: 880px) {
    .user-chip.mobile { display: none; }
  }
  .user-chip.topbar { margin-left: auto; }
  @media (max-width: 879px) {
    .user-chip.topbar { display: none; }
  }

  /* ── T&C step ─────────────────────────────────────────────────── */
  .tc-box { max-height: 220px; padding: 16px 18px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-2); font-size: 13.5px; line-height: 1.55; color: var(--text); }
  .tc-box p { margin-bottom: 8px; }
  .tc-box p:last-child { margin-bottom: 0; }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); cursor: pointer; font-size: 14px; }
  .check-row.error { border-color: var(--occupied); background: var(--occupied-bg); }
  .check-row input { accent-color: var(--accent); width: 18px; height: 18px; }

  /* ── Tables (My bookings, admin lists). grid-auto-flow lets each
       table size itself to its child count — no manual --cols. */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-3); overflow: hidden; margin-bottom: var(--space-3); }
  .table-head, .table-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; padding: 12px 16px; }
  .table-head { background: var(--surface-2); font-size: 11.5px; letter-spacing: var(--letter-wide); text-transform: uppercase; color: var(--text-subtle); font-weight: 500; border-bottom: 1px solid var(--border); }
  .table-row { padding: 14px 16px; align-items: center; border-bottom: 1px solid var(--divider); text-align: left; width: 100%; font-size: 13px; background: var(--surface); }
  .table-row:last-child { border-bottom: 0; }
  .table-row.clickable { cursor: pointer; transition: background .12s; }
  .table-row.clickable:hover { background: var(--surface-2); }
  .table-row > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .empty-row { padding: 20px; color: var(--text-subtle); font-size: 13px; text-align: center; }
  .table-foot-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-subtle); margin-top: var(--space-2); }
  .booking-row.clickable { cursor: pointer; background: var(--surface); }
  .booking-row.clickable:hover { background: var(--surface-2); }

  /* ── Admin detail modal (plan §8) ─────────────────────────────── */
  .detail-modal {
    width: min(560px, calc(100% - 32px)); max-height: min(82vh, 720px);
    background: var(--surface); border-radius: var(--r-3); box-shadow: var(--shadow-xl);
    display: flex; flex-direction: column; overflow: hidden; animation: pop .2s;
  }
  @media (max-width: 879px) {
    .detail-modal { width: 100%; max-width: 100%; height: calc(100% - 24px); max-height: calc(100% - 24px); border-radius: 20px 20px 0 0; animation: slide-up .22s; align-self: flex-end; }
  }
  .detail-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--divider); }
  .detail-title { font-size: 16px; font-weight: 500; }
  .detail-body { padding: 20px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
  .detail-actions .btn { flex: 0 0 auto; }
  .btn.danger, .btn-secondary.danger { color: var(--occupied); }
  .btn-secondary.danger { border-color: oklch(0.86 0.05 25); background: var(--occupied-bg); }
  .btn-secondary.danger:hover { background: oklch(0.93 0.05 25); }

  /* ── FAQ ──────────────────────────────────────────────────────── */
  .faq-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .faq-row { padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); }
  .faq-q { font-weight: 500; font-size: 14.5px; margin-bottom: 4px; }
  .faq-a { font-size: 13px; color: var(--text-muted); line-height: 1.55; }

  /* ── Misc additions ──────────────────────────────────────────── */
  .btn-full { width: 100%; justify-content: center; }
  .cart-summary { display: flex; justify-content: space-between; padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-2); font-size: 13.5px; font-weight: 500; }
  .nav-eyebrow { padding: 0 var(--space-4) 8px; font-size: 10.5px; letter-spacing: var(--letter-wide); text-transform: uppercase; color: var(--text-subtle); }
  .badge.pending, .badge.cancelled { color: var(--text-muted); background: var(--surface-3); }
  .badge.pending .badge-dot, .badge.cancelled .badge-dot { background: var(--text-muted); }

  /* ── Toggle switch ───────────────────────────────────────────── */
  .toggle-wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
  .toggle-wrap + .toggle-wrap { border-top: 1px solid var(--divider); }
  .toggle-wrap.dimmed { opacity: 0.4; pointer-events: none; }
  .toggle-label { display: flex; flex-direction: column; gap: 3px; }
  .toggle-label-title { font-size: 14px; font-weight: 500; }
  .toggle-label-sub { font-size: 12.5px; color: var(--text-muted); }
  .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track { position: absolute; inset: 0; background: var(--border-strong); border-radius: 11px; transition: background .2s; cursor: pointer; }
  .toggle-track::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
  .toggle-switch input:checked ~ .toggle-track { background: var(--accent); }
  .toggle-switch input:checked ~ .toggle-track::before { transform: translateX(18px); }

  /* ── Catering admin panels ───────────────────────────────────── */
  .catering-panels { display: flex; gap: 20px; align-items: flex-start; width: 100%; }
  .catering-panels.catering-off { opacity: 0.45; pointer-events: none; }
  .catering-cat-panel { width: 220px; flex: 0 0 220px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-2); overflow: hidden; }
  /* Products panel — must always take the remaining flex space, never shrink
     to the categories-panel width. flex-basis:0 + flex-grow:1 makes the
     available space split correctly regardless of intrinsic content size. */
  .catering-prod-panel { flex: 1 1 0; min-width: 0; min-height: 320px; }
  .catering-prod-panel > .panel-head,
  .catering-prod-panel > .table-card { width: 100%; box-sizing: border-box; }
  /* Stable product-table layout — explicit column widths so columns don't
     resize when switching between categories with different content widths.
     Product name = fluid, Price = 120px right-aligned, Status = 120px right. */
  .catering-prod-panel .table-head,
  .catering-prod-panel .table-row {
    grid-template-columns: minmax(0, 1fr) 120px 120px;
    grid-auto-flow: row;
    grid-auto-columns: initial;
    width: 100%;
    box-sizing: border-box;
  }
  .catering-prod-panel .table-head > div:nth-child(2),
  .catering-prod-panel .table-row  > div:nth-child(2),
  .catering-prod-panel .table-head > div:nth-child(3),
  .catering-prod-panel .table-row  > div:nth-child(3) { text-align: right; justify-self: end; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--divider); }
  .panel-head-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .cat-list-row { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; transition: background .12s; border-bottom: 1px solid var(--divider); }
  .cat-list-row:last-child { border-bottom: none; }
  .cat-list-row:hover { background: var(--surface-2); }
  .cat-list-row.active { background: var(--accent-soft); }
  .cat-list-name { flex: 1; font-size: 14px; }
  .cat-list-count { font-size: 11px; color: var(--text-subtle); background: var(--surface-3); border-radius: 99px; padding: 1px 7px; font-weight: 500; }
  .cat-list-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .cat-list-row:hover .cat-list-actions, .cat-list-row.active .cat-list-actions { opacity: 1; }
  .icon-btn { padding: 4px; border-radius: var(--r-1); border: none; background: transparent; color: var(--text-subtle); cursor: pointer; display: flex; line-height: 1; }
  .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  /* Mobile: stack the two panels; categories becomes a horizontally-scrollable
     strip so a long category list never gets clipped, and the products panel
     is forced to the same full width (otherwise `flex:1 1 0` with the parent's
     default align-items can leave it intrinsic-width). */
  @media (max-width: 720px) {
    .catering-panels { flex-direction: column; align-items: stretch; }
    .catering-cat-panel {
      width: 100%;
      flex: 0 0 auto;
      max-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .catering-cat-panel .panel-head { position: sticky; top: 0; background: var(--surface); z-index: 1; }
    .catering-prod-panel { width: 100%; flex: 1 1 auto; }
  }

  /* ── Admin schedule ──────────────────────────────────────────── */
  /* ── Schedule page ─────────────────────────────────────────── */
  .sched-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .sched-nav-left  { display: flex; align-items: center; gap: 8px; }
  .sched-nav-right { display: flex; align-items: center; gap: 8px; }
  .sched-date-label { font-size: 15px; font-weight: 600; min-width: 170px; text-align: center; }
  /* Mobile: stack the two nav rows so the Prev/Date/Next group always sits
     on its own line and never gets pushed around when the Today button
     appears/disappears. Date nav stays on top (primary action). */
  @media (max-width: 720px) {
    .sched-nav { flex-direction: column; align-items: stretch; gap: 10px; }
    .sched-nav-right { order: 1; justify-content: space-between; width: 100%; }
    .sched-nav-left  { order: 2; justify-content: space-between; width: 100%; min-height: 34px; flex-wrap: wrap; gap: 8px; }
    .sched-date-label { flex: 1; min-width: 0; }
  }
  /* Single-column rooms table */
  .schedule-table { border: 1px solid var(--border-strong); border-radius: var(--r-2); overflow: hidden; background: var(--surface); }
  .sched-thead { display: flex; background: var(--surface-2); border-bottom: 1px solid var(--border-strong); }
  .sched-th-time  { flex: 0 0 130px; font-size: 11px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .3px; padding: 10px 12px; border-right: 1px solid var(--border-strong); text-align: right; }
  .sched-th-rooms { flex: 1; font-size: 11px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .3px; padding: 10px 14px; }
  .sched-row { display: flex; border-bottom: 1px solid var(--divider); }
  .sched-row:last-child { border-bottom: none; }
  .sched-row-time  { flex: 0 0 130px; font-size: 11.5px; color: var(--text-subtle); padding: 14px 12px; text-align: right; border-right: 1px solid var(--border-strong); font-weight: 500; font-family: monospace; line-height: 1; display: flex; align-items: flex-start; justify-content: flex-end; white-space: nowrap; }
  .sched-row-rooms { flex: 1; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-height: 46px; }
  /* Room chips — pill-shaped, one per room per hour */
  .sched-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 5px 11px 5px 8px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; max-width: 230px; overflow: hidden; background: none; font-family: inherit; cursor: pointer; transition: filter .12s; }
  .sched-chip:hover { filter: brightness(.92); }
  .sched-chip.sched-chip-free { background: var(--surface-2); border-color: var(--border); color: var(--text-subtle); }
  .sched-chip.sched-chip-free:hover { border-color: var(--border-strong); color: var(--text); filter: none; }
  .sched-chip.sched-chip-cont { opacity: .55; border-style: dashed; }
  .sched-chip.submitted  { background: oklch(.97 .04 80);  border-color: oklch(.87 .08 80);  color: oklch(.45 .1  80);  }
  .sched-chip.booked     { background: oklch(.95 .06 145); border-color: oklch(.82 .1  145); color: oklch(.35 .12 145); }
  .sched-chip.checked-in { background: oklch(.90 .08 200); border-color: oklch(.78 .12 200); color: oklch(.32 .12 200); }
  .sched-chip.completed  { background: var(--surface-3);   border-color: var(--border-strong); color: var(--text-muted); }
  .sched-chip.rejected, .sched-chip.cancelled { background: var(--occupied-bg); border-color: var(--occupied); color: var(--occupied); }
  .sched-chip.sched-chip-blockout { background: repeating-linear-gradient(45deg, var(--surface-3), var(--surface-3) 5px, var(--surface-2) 5px, var(--surface-2) 10px); border-color: var(--border-strong); color: var(--text-muted); }
  .sched-chip.sched-chip-blockout:hover { filter: brightness(.96); }
  .sched-chip-dot  { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .sched-chip-room { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .sched-chip-sep  { opacity: .35; }
  .sched-chip-name { overflow: hidden; text-overflow: ellipsis; max-width: 110px; opacity: .85; }
  .sched-empty-day { text-align: center; padding: 44px 24px; color: var(--text-subtle); font-size: 13px; }
  /* Info rows — used inside the booking modal */
  .sched-info-row { display: flex; flex-direction: column; gap: 2px; }
  .sched-info-label { font-size: 10.5px; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .4px; font-weight: 500; }
  .sched-info-value { font-size: 13.5px; }
  /* Schedule booking/slot detail modal */
  .sched-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .sched-modal { background: var(--surface); border-radius: var(--r-2); width: 100%; max-width: 400px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: modal-in .14s ease; }
  .sched-modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--divider); gap: 12px; }
  .sched-modal-title { font-weight: 600; font-size: 14px; font-family: monospace; }
  .sched-modal-sub { font-size: 11px; color: var(--text-subtle); margin-top: 3px; }
  .sched-modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .sched-modal-actions { display: flex; flex-direction: column; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--divider); }

  /* ── Admin bookings filter bar ──────────────────────────────── */
  .filter-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; margin-bottom: 18px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2); }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-label { font-size: 11px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .4px; }
  .filter-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--r-full); background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .12s, border-color .12s, color .12s; white-space: nowrap; }
  .filter-chip:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .filter-chip.active:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .filter-chip-count { font-variant-numeric: tabular-nums; font-size: 11px; padding: 1px 6px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-subtle); font-weight: 600; }
  .filter-chip.active .filter-chip-count { background: rgba(255,255,255,.18); color: rgba(255,255,255,.92); }
  /* The shared dropdown is full-width and 46px tall by default. Override it
     to be compact + content-sized when it lives inside the filter bar. */
  .filter-group .dropdown { width: auto; min-width: 150px; }
  .filter-group .dropdown-trigger { height: 36px; padding: 0 10px; font-size: 13.5px; width: 100%; }
  .filter-dropdown-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-2); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .filter-dropdown-btn:hover { background: var(--surface-2); }
  .filter-dropdown-btn.active { border-color: var(--accent); color: var(--accent); }
  .filter-custom { display: flex; align-items: center; gap: 8px; }
  .filter-custom input[type="date"] { height: 32px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--r-1); font: inherit; font-size: 12.5px; background: var(--surface); color: var(--text); }
  .filter-summary { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); }
  .filter-clear { background: none; border: none; color: var(--accent); font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 4px 6px; border-radius: var(--r-1); }
  .filter-clear:hover { background: var(--accent-soft); }
  .empty-state { padding: 56px 24px; text-align: center; color: var(--text-subtle); font-size: 14px; background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: var(--r-2); }
  @media (max-width: 720px) {
    /* The filter bar itself must not be wider than its grid cell.
       NOTE: do NOT use overflow:hidden here — the date dropdown popup is
       position:absolute and would be clipped by any ancestor clip. The chip
       strip is constrained by its own width:100% + overflow-x:auto below. */
    .filter-bar { flex-direction: column; align-items: stretch; min-width: 0; max-width: 100%; }
    /* Each filter group needs to be a proper full-width column-flex container
       so the chip strip below it inherits a constrained width and can scroll
       within it rather than push out the parent. */
    .filter-group { flex-direction: column; align-items: stretch; width: 100%; min-width: 0; }
    .filter-label { align-self: flex-start; }
    /* Horizontal-scroll strip for the status chips on small screens. width:100%
       + min-width:0 are what actually constrain it — without them, flex-wrap:
       nowrap lets the row expand to the sum of chip widths and overflow. */
    .filter-chips { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; width: 100%; min-width: 0; max-width: 100%; padding-bottom: 4px; }
    .filter-chips::-webkit-scrollbar { height: 4px; }
    .filter-chips::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
    .filter-chip { flex: 0 0 auto; }
    /* The compact dropdown stretches to fill the column on mobile so the
       chevron sits flush with the right edge of the bar. */
    .filter-group .dropdown { width: 100%; min-width: 0; }
    .filter-custom { flex-wrap: wrap; }
    .filter-custom input[type="date"] { flex: 1 1 0; min-width: 0; }
    .filter-summary { margin-left: 0; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  }

  /* ── Booking-detail QR card ─────────────────────────────────── */
  /* Top of every booking modal — admin/user gets a scannable code plus the
     key facts at a glance. Layout is intentionally side-by-side on desktop
     and stacked on mobile (QR centered, facts beneath).                    */
  .booking-qr-card { display: flex; gap: 16px; padding: 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-2); margin-bottom: 16px; align-items: center; }
  /* Cancelled/rejected bookings: dim the whole card so a stale QR can't be
     misread as still valid. The status badge inside already says why. */
  .booking-qr-card.is-stale { opacity: .45; }
  .booking-qr-art { flex: 0 0 auto; padding: 8px; background: white; border-radius: var(--r-2); box-shadow: var(--shadow-sm); line-height: 0; }
  .booking-qr-art svg { display: block; }
  .booking-qr-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .booking-qr-no   { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
  .booking-qr-row  { display: flex; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .booking-qr-row  .label { color: var(--text-subtle); min-width: 50px; font-size: 12px; }
  .booking-qr-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .booking-qr-actions .btn { height: 30px; padding: 0 10px; font-size: 12px; }
  @media (max-width: 560px) {
    .booking-qr-card { flex-direction: column; align-items: stretch; text-align: center; }
    .booking-qr-art  { align-self: center; }
    .booking-qr-row  { justify-content: center; }
    .booking-qr-row .label { min-width: 0; }
    .booking-qr-actions { justify-content: center; }
  }

  /* ── QR Scanner modal (admin) ───────────────────────────────── */
  .scanner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s ease; }
  .scanner-modal { background: var(--surface); border-radius: var(--r-3); width: 100%; max-width: 480px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; animation: modal-in .2s ease; }
  .scanner-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--divider); }
  .scanner-title { font-weight: 600; font-size: 15px; }
  .scanner-body { padding: 16px 18px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .scanner-stage { position: relative; aspect-ratio: 1/1; background: #000; border-radius: var(--r-2); overflow: hidden; }
  .scanner-stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Reticle overlay — square viewport with a hole-punched dim mask. */
  .scanner-frame { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .scanner-frame::before { content: ''; position: absolute; inset: 0; box-shadow: 0 0 0 9999px rgba(0,0,0,.42) inset; pointer-events: none; }
  .scanner-frame-box { width: 64%; aspect-ratio: 1/1; border: 2px solid rgba(255,255,255,.92); border-radius: var(--r-2); box-shadow: 0 0 0 9999px rgba(0,0,0,.42); position: relative; }
  .scanner-frame-corner { position: absolute; width: 22px; height: 22px; border: 3px solid var(--accent-fg); }
  .scanner-frame-corner.tl { top: -2px; left: -2px;    border-right: 0; border-bottom: 0; border-top-left-radius: var(--r-2); }
  .scanner-frame-corner.tr { top: -2px; right: -2px;   border-left: 0;  border-bottom: 0; border-top-right-radius: var(--r-2); }
  .scanner-frame-corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0;    border-bottom-left-radius: var(--r-2); }
  .scanner-frame-corner.br { bottom: -2px; right: -2px;border-left: 0;  border-top: 0;    border-bottom-right-radius: var(--r-2); }
  .scanner-status { font-size: 12px; color: var(--text-subtle); text-align: center; min-height: 16px; }
  .scanner-status.error { color: var(--occupied); }
  .scanner-status.success { color: oklch(.45 .14 145); font-weight: 500; }
  .scanner-fallback { border-top: 1px solid var(--divider); padding-top: 14px; }
  .scanner-fallback-label { font-size: 11px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
  .scanner-fallback-row { display: flex; gap: 8px; }
  .scanner-fallback-row input { flex: 1; height: 38px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-2); font: inherit; font-size: 14px; color: var(--text); background: var(--surface); }
  .scanner-fallback-row input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .scanner-perm-denied { padding: 18px; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.5; }
  @media (max-width: 560px) {
    .scanner-overlay { padding: 0; align-items: stretch; }
    .scanner-modal   { max-width: 100%; max-height: 100vh; border-radius: 0; height: 100%; }
  }

  /* ── Floating-action button (Scan QR) ───────────────────────── */
  .fab { position: fixed; right: 20px; bottom: 20px; z-index: 90;
         display: inline-flex; align-items: center; gap: 8px;
         padding: 0 18px; height: 52px; border-radius: var(--r-full);
         background: var(--accent); color: var(--accent-fg);
         border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500;
         box-shadow: 0 8px 24px rgba(15,22,36,.25), 0 2px 6px rgba(15,22,36,.10);
         transition: transform .12s, box-shadow .12s; }
  .fab:hover { transform: translateY(-1px); background: var(--accent-hover); }
  .fab:active { transform: translateY(0); }
  /* Sit above the mobile bottom nav (which uses ≈64px). Adds safe-area inset
     so iOS home-indicator doesn't overlap. */
  @media (max-width: 879px) {
    .fab { right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); padding: 0 14px; height: 48px; font-size: 13.5px; }
  }

  /* ── Confirmation modal (destructive actions) ──────────────── */
  .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2147483646; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .confirm-modal   { background: var(--surface); border-radius: var(--r-2); width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.3); animation: modal-in .14s ease; }
  .confirm-head    { display: flex; align-items: center; gap: 12px; padding: 18px 22px 8px; }
  .confirm-icon    { width: 36px; height: 36px; border-radius: 50%; background: var(--occupied-bg); color: var(--occupied); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .confirm-title   { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .confirm-body    { padding: 4px 22px 18px; font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }
  .confirm-actions { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--divider); justify-content: flex-end; }
  .confirm-actions .btn { flex: 0 1 auto; min-width: 110px; }

  /* ── Brand visual page ───────────────────────────────────────── */
  .brand-layout { display: flex; gap: 28px; align-items: flex-start; }
  .brand-form   { flex: 0 0 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .brand-logo-chip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-2); margin-top: 8px; }
  /* Display-text page two-column layout */
  .text-layout { display: flex; gap: 28px; align-items: flex-start; }
  .text-form { flex: 0 0 500px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  .text-preview-col { flex: 1; min-width: 260px; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 40px); overflow-y: auto; }
  .text-preview-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-subtle); margin-bottom: -6px; }
  .text-preview-section { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-2); overflow: hidden; }
  @media (max-width: 1000px) { .text-layout { flex-direction: column; } .text-form { flex: none; width: 100%; max-width: 760px; } .text-preview-col { width: 100%; position: static; max-height: none; } }
  .brand-preview-col { flex: 1; min-width: 260px; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .brand-preview-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-subtle); }
  .brand-preview-desktop {
    border-radius: var(--r-2); overflow: hidden; position: relative;
    aspect-ratio: 4/5; display: flex; flex-direction: column;
    padding: 28px; color: white; background-size: cover; background-position: center;
    min-height: 320px;
  }
  .brand-preview-desktop::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 80% 110%, rgba(0,80,100,.35) 0%, transparent 55%);
  }
  .brand-preview-pattern {
    position: absolute; inset: 16px;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.04) 14px, rgba(255,255,255,.06) 14px, rgba(255,255,255,.06) 28px);
    border-radius: var(--r-2); border: 1px solid rgba(255,255,255,.07);
  }
  .brand-preview-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  .brand-preview-eyebrow { font-size: 9px; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,.55); font-weight: 500; margin-top: auto; }
  .brand-preview-headline { font-size: 22px; font-weight: 500; line-height: 1.15; margin-top: 6px; }
  .brand-preview-headline em { color: rgba(255,255,255,.6); font-style: italic; }
  .brand-preview-lede { font-size: 11px; color: rgba(255,255,255,.65); margin-top: 8px; line-height: 1.5; }
