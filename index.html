function renderQR(seed, size = 190) {
  const N = 25;
  const cells = [];
  let h = 0;
  for (let i = 0; i < (seed || '').length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  for (let r = 0; r < N; r++) {
    cells[r] = [];
    for (let c = 0; c < N; c++) {
      h = (h * 1103515245 + 12345) >>> 0;
      cells[r][c] = (h % 100) < 48 ? 1 : 0;
    }
  }
  const finder = (r0, c0) => {
    for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) {
      const rr = r0 + i, cc = c0 + j;
      if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
      if (i < 0 || j < 0 || i > 6 || j > 6) cells[rr][cc] = 0;
      else if (i === 0 || i === 6 || j === 0 || j === 6) cells[rr][cc] = 1;
      else if (i >= 2 && i <= 4 && j >= 2 && j <= 4) cells[rr][cc] = 1;
      else cells[rr][cc] = 0;
    }
  };
  finder(0, 0); finder(0, N-7); finder(N-7, 0);
  const cell = size / N;
  let rects = `<rect width="${size}" height="${size}" fill="#fff"/>`;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (cells[r][c]) rects += `<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="#0c1322"/>`;
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rects}</svg>`;
}

/* ────────────────────────────────────────────────────────────────────
   VALIDATION & ACTIONS
──────────────────────────────────────────────────────────────────── */
/* Compute validation errors for the *current* step without mutating state.
   `validate(setErrors)` actually writes them when called. canProceed() is
   used to gray-out the Continue button live (plan §6). */
function stepErrors(stepName) {
  const f = state.flow;
  const date = state.selectedDate || today();
  const e = {};
  switch (stepName) {
    case 'tc':
      if (!f.tcAccepted) e.tc = 'You must agree to the terms before continuing.';
      break;
    case 'contact':
      if (!f.contact.name.trim()) e.name = 'Full name is required.';
      if (!f.contact.phone.trim()) e.phone = 'Phone number required.';
      else {
        const digits = f.contact.phone.replace(/\D/g, '');
        if (digits.length !== 10) e.phone = 'Enter a valid 10-digit phone number.';
      }
      break;
    case 'booking':
      if (f.guests === null || f.guests < 1) e.guests = 'Enter the number of participants.';
      if (!f.slot) e.slot = 'Please pick a time range.';
      if (!f.roomId) e.room = 'Select a room to continue.';
      if (f.slot && f.roomId && f.guests !== null) {
        const dayData = generateDayData(date);
        const r = ROOMS[f.roomId];
        let slotFree = true;
        const arr = dayData[f.roomId];
        for (let i = f.slot.startIdx; i <= f.slot.endIdx; i++) if (arr[i] !== 'available') { slotFree = false; break; }
        const capOk = f.guests >= r.minCap && f.guests <= r.maxCap;
        if (!slotFree || !capOk) e.room = 'This room is no longer available — pick another.';
      }
      break;
    case 'catering':
      if (CONFIG.cateringMandatory && Object.keys(f.cart).length === 0) {
        e.catering = 'At least one catering item is required.';
      }
      break;
    // summary / completion have no per-step requirements
  }
  return e;
}

function canProceed() {
  return Object.keys(stepErrors(currentStepName())).length === 0;
}

function validate() {
  const e = stepErrors(currentStepName());
  state.flow.errors = e;
  return Object.keys(e).length === 0;
}

function flowNext() {
  if (!validate()) { render(); return; }
  state.flow.errors = {};
  const steps = activeSteps();
  const cur = currentStepName();
  if (cur === 'summary') {
    // Submit the booking — mint a number, push into the mock api, advance to completion.
    const date = state.selectedDate || today();
    const r = ROOMS[state.flow.roomId];
    const startHour = SLOT_HOURS[state.flow.slot.startIdx];
    const endHour   = SLOT_HOURS[state.flow.slot.endIdx] + 1;

    // Final safety check — apply parent-child rules against any booking that
    // landed in api.bookings since the slot was chosen.
    const conflict = findBookingConflict(state.flow.roomId, date, startHour, endHour);
    if (conflict) {
      const reason = conflict.room === r.name
        ? `${r.name} already has booking ${conflict.no} at ${conflict.time}.`
        : `${r.name} is blocked by ${conflict.room} (booking ${conflict.no}, ${conflict.time}).`;
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'submitBooking', detail: `${r.name} ${date.toDateString()}`, result: `BLOCKED · ${reason}` });
      showToast(`Slot conflict — ${reason}`, 'error');
      // Bounce the user back to the booking step so they can pick again.
      state.flow.step = activeSteps().indexOf('booking');
      state.flow.slot = null;
      state.flow.roomId = null;
      render();
      return;
    }

    const no = 'RBK-' + Math.random().toString(36).slice(2, 7).toUpperCase();
    state.flow.bookingNo = no;
    const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const timeStr = `${SLOT_LABELS[state.flow.slot.startIdx]} – ${String(SLOT_HOURS[state.flow.slot.endIdx]+1).padStart(2,'0')}:00`;
    api.bookings.unshift({
      no, room: r.name, date: dateStr, time: timeStr, status: 'submitted',
      email: state.flow.contact.email || CURRENT_USER.email,
      guests: state.flow.guests, phone: state.flow.contact.phone,
      // Full snapshot so the booking can be edited later (name/phone/remark/catering)
      contact: { ...state.flow.contact },
      cart: { ...state.flow.cart },
    });
    api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'submitBooking', detail: no, result: 'SUCCESS' });
    // Persist to Supabase (fire-and-forget — in-memory already updated above)
    dbInsertBooking(api.bookings[0]);
    dbInsertAudit(api.audit[0]);
    state.flow.step = steps.indexOf('completion');
  } else {
    state.flow.step = Math.min(steps.length - 1, state.flow.step + 1);
  }
  render();
}

function flowBack() {
  if (state.flow.step > 0) {
    state.flow.errors = {};
    state.flow.step -= 1;
    render();
  } else {
    closeFlow();
  }
}

function closeFlow() {
  state.flow.open = false;
  resetFlow();
  render();
}

function openFlowForDate(d) {
  state.selectedDate = d;
  resetFlow();
  state.flow.open = true;
  render();
}

/* ────────────────────────────────────────────────────────────────────
   EVENT WIRING
──────────────────────────────────────────────────────────────────── */
function attachListeners() {
  document.getElementById('root').addEventListener('click', onClick, { once: false });

  // Styled toggle-switches hide their <input> behind a visible <span class="toggle-track">.
  // The click event fires on the span (not the input), so the normal click→data-action
  // pipeline can't reach the input's data-action attribute. Instead, listen for the
  // input's `change` event (fired by native label activation) and route it through
  // handleAction with the input as the target.
  document.querySelectorAll('input[type="checkbox"][data-action]').forEach(inp => {
    inp.addEventListener('change', e => {
      handleAction(inp.getAttribute('data-action'), inp, e);
    });
  });

  // Live input wiring — update state on each input event, then refresh the
  // Continue button's disabled state via direct DOM (no full re-render).
  // The typed value is already in the DOM (the user just typed it), so we
  // never need to rebuild the input → no flicker, no caret/focus jumps.
  document.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      const key = e.target.getAttribute('data-field');
      const isCheckbox = e.target.type === 'checkbox';
      const val = isCheckbox ? e.target.checked : e.target.value;
      if (key === 'tcAccepted') {
        state.flow.tcAccepted = !!val;
      } else if (key === 'phone') {
        // Auto-format as xxx-xxx-xxxx, max 10 digits.
        const digits = val.replace(/\D/g, '').slice(0, 10);
        let formatted = digits;
        if (digits.length > 6)      formatted = `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
        else if (digits.length > 3) formatted = `${digits.slice(0,3)}-${digits.slice(3)}`;
        state.flow.contact.phone = formatted;
        // Update the input in-place so the formatted value is visible without a re-render.
        e.target.value = formatted;
      } else if (key in state.flow.contact) {
        state.flow.contact[key] = val;
      }
      // Inside the booking flow: just refresh the Continue button.
      // Outside the flow: fall back to full render (e.g. login form).
      if (state.flow.open) refreshFlowContinueButton();
      else                 render();
    });
  });

  // Brand visual form inputs — store edits in state.brandValues, refresh preview without full render.
  document.querySelectorAll('[data-brand-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      state.brandValues = state.brandValues || {};
      state.brandValues[e.target.getAttribute('data-brand-field')] = e.target.value;
      // Sync paired color inputs (color picker ↔ hex text)
      const key = e.target.getAttribute('data-brand-field');
      document.querySelectorAll(`[data-brand-field="${key}"]`).forEach(other => {
        if (other !== e.target) other.value = e.target.value;
      });
      refreshBrandPreview();
    });
  });

  // Display-text form inputs — store edits in state.textValues until Save.
  document.querySelectorAll('[data-text-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      state.textValues = state.textValues || {};
      state.textValues[e.target.getAttribute('data-text-field')] = e.target.value;
      refreshTextPreview();
    });
    inp.addEventListener('change', e => {
      // Handle checkboxes — input event also fires but value is wrong
      if (e.target.type === 'checkbox') {
        state.textValues = state.textValues || {};
        state.textValues[e.target.getAttribute('data-text-field')] = e.target.checked;
        refreshTextPreview();
      }
    });
  });
  // FAQ row inputs — write back into state.textValues.faqs[i]
  document.querySelectorAll('[data-faq-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = parseInt(e.target.getAttribute('data-i'), 10);
      const key = e.target.getAttribute('data-faq-field');
      state.textValues = state.textValues || {};
      state.textValues.faqs = state.textValues.faqs || JSON.parse(JSON.stringify(CONFIG.faqs || []));
      if (state.textValues.faqs[i]) state.textValues.faqs[i][key] = e.target.value;
      refreshTextPreview();
    });
  });

  // Scanner manual-lookup input — keep state in sync without triggering a
  // re-render (which would tear down the live <video> element).
  document.querySelectorAll('input[data-scanner-manual]').forEach(inp => {
    inp.addEventListener('input', e => {
      if (state.scanner) state.scanner.manualCode = e.target.value;
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); handleAction('scanner-manual-submit', inp, e); }
    });
  });

  // Manage-bookings custom date range inputs — write back on change.
  document.querySelectorAll('input[type="date"][data-action="filter-bookings-custom"]').forEach(inp => {
    inp.addEventListener('change', e => {
      state.adminBookingsFilters = state.adminBookingsFilters || { status: 'all', date: 'custom', customFrom: '', customTo: '' };
      const side = e.target.getAttribute('data-side');
      if (side === 'from') state.adminBookingsFilters.customFrom = e.target.value || '';
      if (side === 'to')   state.adminBookingsFilters.customTo   = e.target.value || '';
      render();
    });
  });

  // Config form inputs — store in temporary state until Save is clicked.
  document.querySelectorAll('[data-config-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      state.configValues = state.configValues || {};
      state.configValues[e.target.getAttribute('data-config-field')] = e.target.value;
    });
  });

  // Room-edit form inputs — same live-update pattern as the create form.
  document.querySelectorAll('[data-room-edit-field]').forEach(inp => {
    const evt = inp.tagName === 'SELECT' ? 'change' : 'input';
    inp.addEventListener(evt, e => {
      if (!state.detailModal || !state.detailModal.draft) return;
      const key = e.target.getAttribute('data-room-edit-field');
      state.detailModal.draft[key] = e.target.value;
    });
  });

  // Admin create-form inputs (text inputs + selects) — live update of
  // state.detailModal.draft. No re-render on every keystroke so the
  // caret/focus stays put.
  document.querySelectorAll('[data-create-field]').forEach(inp => {
    const evt = inp.tagName === 'SELECT' ? 'change' : 'input';
    inp.addEventListener(evt, e => {
      if (!state.detailModal || !state.detailModal.draft) return;
      const key = e.target.getAttribute('data-create-field');
      state.detailModal.draft[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    });
  });

  // Inline booking-edit inputs — live update of state.detailModal.draft.
  // Same phone-formatting rule as the wizard, no re-render on keystroke.
  document.querySelectorAll('input[data-edit-field]').forEach(inp => {
    inp.addEventListener('input', e => {
      if (!state.detailModal || !state.detailModal.draft) return;
      const key = e.target.getAttribute('data-edit-field');
      const val = e.target.value;
      if (key === 'phone') {
        const digits = val.replace(/\D/g, '').slice(0, 10);
        let formatted = digits;
        if (digits.length > 6)      formatted = `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
        else if (digits.length > 3) formatted = `${digits.slice(0,3)}-${digits.slice(3)}`;
        state.detailModal.draft.phone = formatted;
        e.target.value = formatted;
      } else {
        state.detailModal.draft[key] = val;
      }
    });
  });
}

function onClick(e) {
  // Suppress default browser behavior (scroll-to-top on <a href="#">,
  // submit on bare <button>, etc.) — but leave form controls alone so
  // checkboxes/radios/inputs still toggle and focus normally.
  // Crucially, also leave clicks INSIDE a <label> alone so the native
  // label→input activation can run (otherwise toggle-switch styled
  // checkboxes — which hide the input and show a styled span — would
  // never toggle when the user clicks the visible part).
  const tag = e.target.tagName;
  const isFormControl = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'LABEL'
                        || !!e.target.closest('label');
  if (!isFormControl) e.preventDefault();

  // Close any open custom dropdown if the click landed outside of it.
  // (Clicks inside the same dropdown are handled by toggle-dropdown / pick-dropdown.)
  let dropdownClosed = false;
  if (state.openDropdown) {
    const ddEl = e.target.closest('.dropdown');
    if (!ddEl || ddEl.getAttribute('data-dd-key') !== state.openDropdown) {
      state.openDropdown = null;
      dropdownClosed = true;
    }
  }

  const stopper = e.target.closest('[data-stop="1"]');
  const overlayCloseTarget = e.target.closest('.sheet-overlay,.nav-overlay');

  const target = e.target.closest('[data-action]');
  if (!target) {
    if (overlayCloseTarget && !stopper) {
      const action = overlayCloseTarget.getAttribute('data-action');
      if (action) { handleAction(action, overlayCloseTarget, e); return; }
    }
    if (dropdownClosed) render();
    return;
  }
  const action = target.getAttribute('data-action');
  if (stopper && !stopper.contains(target)) {
    if (dropdownClosed) render();
    return;
  }
  handleAction(action, target, e);
}

/* Aggregate slot status for the current guest count — used by the slot
   picker and the booking-step body. With no guest count yet, treat all
   rooms as candidates so the user can see the timeline. */
function aggregatedSlotStatus(dayData, guests) {
  const ids = guests != null ? roomsForGuests(guests) : ALL_ROOM_IDS;
  return SLOT_HOURS.map((_, i) => {
    const states = ids.map(id => dayData[id][i]);
    if (states.includes('available')) return 'available';
    if (states.includes('submitted')) return 'submitted';
    if (states.includes('blocked')) return 'blocked';
    return 'occupied';
  });
}

function handleAction(action, target, ev) {
  // ── Confirmation interceptor ─────────────────────────────────────────
  // If this action is registered in CONFIRM_PROMPTS, divert to the confirm
  // modal first. The action is re-dispatched via `confirm-yes` once the
  // user explicitly approves. We snapshot every data-* attr from the
  // triggering button so the resumed dispatch can read them.
  if (CONFIRM_PROMPTS[action] && !state._bypassConfirm) {
    const data = {};
    if (target && target.attributes) {
      for (const a of target.attributes) {
        if (a.name.startsWith('data-')) data[a.name] = a.value;
      }
    }
    state.confirmModal = { action, data, ...CONFIRM_PROMPTS[action] };
    render();
    return;
  }

  // Handle the confirm modal's own buttons.
  if (action === 'confirm-cancel') {
    state.confirmModal = null;
    render();
    return;
  }
  if (action === 'confirm-yes') {
    const c = state.confirmModal;
    if (!c) { render(); return; }
    state.confirmModal = null;
    // Synthesise a target that mimics the original button's data-* attrs.
    const fakeTarget = {
      getAttribute: (k) => (c.data[k] !== undefined ? c.data[k] : null),
      hasAttribute: (k) => c.data[k] !== undefined,
      attributes: Object.entries(c.data).map(([name, value]) => ({ name, value })),
      closest: () => null,
    };
    // Bypass the interceptor on the resumed call so we actually execute.
    state._bypassConfirm = true;
    try { handleAction(c.action, fakeTarget, null); }
    finally { state._bypassConfirm = false; }
    return;
  }

  switch (action) {
    case 'google-signin': {
      state.signingIn = true; render();
      setTimeout(() => {
        state.signingIn = false;
        state.screen = 'app';
        state.route = 'user';
        state.page = 'booking';
        render();
      }, 1400);
      break;
    }
    case 'toggle-login-error': state.loginError = !state.loginError; render(); break;
    case 'dismiss-login-error': state.loginError = false; render(); break;
    case 'dismiss-notice': state.notice = false; render(); break;

    /* Navigation */
    case 'nav': {
      const id = target.getAttribute('data-nav');
      if (id) state.page = id;
      state.navOpen = false;
      render();
      break;
    }
    case 'route-admin': {
      state.route = 'admin';
      state.page = 'admin-bookings';
      state.navOpen = false;
      render();
      break;
    }
    case 'route-user': {
      state.route = 'user';
      state.page = 'booking';
      state.navOpen = false;
      render();
      break;
    }
    case 'open-nav': state.navOpen = true; render(); break;
    case 'close-nav': state.navOpen = false; render(); break;

    /* Calendar */
    case 'prev-month': {
      let m = state.view.month - 1, y = state.view.year;
      if (m < 0) { m = 11; y -= 1; }
      state.view = { month: m, year: y }; render(); break;
    }
    case 'next-month': {
      let m = state.view.month + 1, y = state.view.year;
      if (m > 11) { m = 0; y += 1; }
      state.view = { month: m, year: y }; render(); break;
    }
    case 'pick-date': {
      const iso = target.getAttribute('data-iso');
      if (iso) {
        const selectedDate = new Date(iso);
        // Admins bypass the booking-window config — match the same predicate
        // used in renderDayGrid() so visual + click behavior stay in sync.
        const isAdmin = state.route === 'admin' || isAdminUser(CURRENT_USER.email);
        if (!isAdmin) {
          const t = today();
          const minSelectDate = new Date(t.getFullYear(), t.getMonth(), t.getDate() + CONFIG.nonAdminMinDays);
          const maxSelectDate = new Date(t.getFullYear(), t.getMonth(), t.getDate() + CONFIG.nonAdminMaxDays);
          if (selectedDate < minSelectDate || selectedDate > maxSelectDate) {
            break;
          }
        }
        openFlowForDate(selectedDate);
      }
      break;
    }
    case 'quick-book': {
      const t = today();
      openFlowForDate(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1));
      break;
    }

    /* Booking flow */
    case 'close-flow': closeFlow(); break;
    case 'flow-next': flowNext(); break;
    case 'flow-back': flowBack(); break;
    case 'pick-slot': {
      const idx = parseInt(target.getAttribute('data-idx'), 10);
      const date = state.selectedDate || today();
      const dayData = generateDayData(date);
      const f = state.flow;
      const agg = aggregatedSlotStatus(dayData, f.guests);
      if (agg[idx] !== 'available') break;
      if (!f.slot) {
        f.slot = { startIdx: idx, endIdx: idx };
      } else if (idx === f.slot.startIdx && idx === f.slot.endIdx) {
        // Single slot is selected and the user re-clicked it → fully deselect.
        f.slot = null;
      } else if (idx === f.slot.startIdx) {
        // Re-click the LEFT edge → drop only that slot from the range.
        f.slot = { startIdx: f.slot.startIdx + 1, endIdx: f.slot.endIdx };
      } else if (idx === f.slot.endIdx) {
        // Re-click the RIGHT edge → drop only that slot from the range.
        f.slot = { startIdx: f.slot.startIdx, endIdx: f.slot.endIdx - 1 };
      } else if (idx > f.slot.startIdx && idx < f.slot.endIdx) {
        // Re-click a slot inside the middle of the range — keep selection
        // unchanged (a contiguous range can't be split, so this is a no-op).
        break;
      } else {
        // Click outside the current range → try to extend the range to include it.
        const start = Math.min(f.slot.startIdx, idx);
        const end = Math.max(f.slot.endIdx, idx);
        let ok = true;
        for (let k = start; k <= end; k++) if (agg[k] !== 'available') { ok = false; break; }
        if (ok) f.slot = { startIdx: start, endIdx: end };
        else f.slot = { startIdx: idx, endIdx: idx };
      }
      if (f.roomId && f.slot) {
        const arr = dayData[f.roomId];
        let free = true;
        for (let i = f.slot.startIdx; i <= f.slot.endIdx; i++) if (arr[i] !== 'available') { free = false; break; }
        if (!free) f.roomId = null;
      }
      render(); break;
    }
    case 'guests-inc': {
      const cur = state.flow.guests !== null ? state.flow.guests : 1;
      const n = Math.min(16, cur + 1);
      state.flow.guests = n;
      const r = state.flow.roomId ? ROOMS[state.flow.roomId] : null;
      if (r && (n < r.minCap || n > r.maxCap)) state.flow.roomId = null;
      render(); break;
    }
    case 'guests-dec': {
      const cur = state.flow.guests !== null ? state.flow.guests : 1;
      const n = Math.max(1, cur - 1);
      state.flow.guests = n;
      const r = state.flow.roomId ? ROOMS[state.flow.roomId] : null;
      if (r && (n < r.minCap || n > r.maxCap)) state.flow.roomId = null;
      render(); break;
    }
    case 'pick-room': {
      const id = target.getAttribute('data-room');
      if (!target.disabled) state.flow.roomId = id;
      render(); break;
    }
    case 'set-cat': state.flow.activeCat = target.getAttribute('data-cat'); render(); break;
    case 'qty-set': {
      const pid = target.getAttribute('data-pid');
      const qty = parseInt(target.getAttribute('data-qty'), 10) || 0;
      if (qty <= 0) delete state.flow.cart[pid];
      else state.flow.cart[pid] = qty;
      render(); break;
    }

    /* Detail modal (plan §8) */
    case 'open-booking': {
      const no = target.getAttribute('data-no');
      const rec = api.bookings.find(b => b.no === no);
      state.detailModal = { kind: 'booking', record: rec, title: `Booking ${no}` };
      render(); break;
    }
    case 'open-room': {
      const id = target.getAttribute('data-room');
      state.detailModal = { kind: 'room', record: ROOMS[id], title: `Room ${ROOMS[id] && ROOMS[id].name}` };
      render(); break;
    }
    case 'open-blockout': {
      const id = target.getAttribute('data-id');
      state.detailModal = { kind: 'blockout', record: api.blockouts.find(b => b.id === id), title: 'Blockout' };
      render(); break;
    }
    case 'open-blacklist': {
      const email = target.getAttribute('data-email');
      state.detailModal = { kind: 'blacklist', record: api.blacklist.find(b => b.email === email), title: 'Blacklist entry' };
      render(); break;
    }
    case 'open-audit': {
      const ts = target.getAttribute('data-ts');
      state.detailModal = { kind: 'audit', record: api.audit.find(a => a.ts === ts), title: 'Audit entry' };
      render(); break;
    }
    case 'close-detail': state.detailModal = null; render(); break;

    /* Admin: open create-mode detail modals */
    case 'create-room': {
      state.detailModal = { kind: 'room', mode: 'create', record: null, title: 'Add room', draft: { id:'', name:'', minCap:'', maxCap:'', rate:'', parentId:'', blurb:'' }, errors: {} };
      render(); break;
    }
    case 'edit-room': {
      const id = target.getAttribute('data-room');
      const r = ROOMS[id];
      if (!r) break;
      state.detailModal = {
        kind: 'room', record: r, title: `Edit ${r.name}`,
        editing: true,
        draft: {
          name: r.name, minCap: r.minCap, maxCap: r.maxCap,
          rate: r.rate, parentId: r.parentId || '', blurb: r.blurb || '',
        },
        errors: {},
      };
      render(); break;
    }
    case 'edit-room-cancel': {
      const m = state.detailModal;
      if (m && m.record) {
        state.detailModal = { kind: 'room', record: m.record, title: `Room ${m.record.name}` };
      } else {
        state.detailModal = null;
      }
      render(); break;
    }
    case 'save-room-edit': {
      const id = target.getAttribute('data-room');
      const r = ROOMS[id];
      const m = state.detailModal;
      if (!r || !m || !m.draft) break;
      const d = m.draft;
      const errs = {};
      const name = String(d.name || '').trim();
      const minCap = parseInt(d.minCap, 10);
      const maxCap = parseInt(d.maxCap, 10);
      const rate = parseFloat(d.rate);
      if (!name) errs.name = 'Name is required.';
      if (!Number.isFinite(minCap) || minCap < 1) errs.minCap = 'Min ≥ 1.';
      if (!Number.isFinite(maxCap) || maxCap < 1) errs.maxCap = 'Max ≥ 1.';
      if (Number.isFinite(minCap) && Number.isFinite(maxCap) && minCap > maxCap) errs.maxCap = 'Max must be ≥ Min.';
      if (!Number.isFinite(rate) || rate < 0) errs.rate = 'Rate ≥ 0.';
      // Reject parent that would create a cycle (selecting self or a child).
      const newParent = d.parentId || null;
      if (newParent && (newParent === id || ROOMS[newParent]?.parentId === id)) errs.name = 'Invalid parent (would create a cycle).';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      const before = { name: r.name, minCap: r.minCap, maxCap: r.maxCap, rate: r.rate, parentId: r.parentId || null, blurb: r.blurb || '' };
      const after  = { name, minCap, maxCap, rate, parentId: newParent, blurb: String(d.blurb || '').trim() };
      Object.assign(r, after);
      api.audit.unshift({
        ts: new Date().toISOString(), actor: CURRENT_USER.email,
        action: 'updateRoom', detail: `${id}: ${JSON.stringify({ before, after })}`,
        result: 'SUCCESS'
      });
      state.detailModal = { kind: 'room', record: r, title: `Room ${r.name}` };
      render();
      showToast('Room updated');
      break;
    }
    case 'create-blockout': {
      state.detailModal = { kind: 'blockout', mode: 'create', record: null, title: 'Add blockout', draft: { room:'', date:'', start:'', end:'', reason:'' }, errors: {} };
      render(); break;
    }
    case 'create-blacklist': {
      state.detailModal = { kind: 'blacklist', mode: 'create', record: null, title: 'Add blacklist entry', draft: { email:'', reason:'' }, errors: {} };
      render(); break;
    }
    case 'create-admin': {
      state.detailModal = { kind: 'admin', mode: 'create', record: null, title: 'Add admin', draft: { email: '' }, errors: {} };
      render(); break;
    }

    /* Admin: persist new records */
    case 'save-room': {
      const m = state.detailModal; if (!m || !m.draft) break;
      const d = m.draft;
      const errs = {};
      const id = String(d.id || '').trim();
      const name = String(d.name || '').trim();
      const minCap = parseInt(d.minCap, 10);
      const maxCap = parseInt(d.maxCap, 10);
      const rate = parseFloat(d.rate);
      if (!id) errs.id = 'ID is required.';
      else if (!/^[A-Za-z0-9_\-]+$/.test(id)) errs.id = 'Letters, numbers, _ and - only.';
      else if (ROOMS[id]) errs.id = 'A room with this ID already exists.';
      if (!name) errs.name = 'Name is required.';
      if (!Number.isFinite(minCap) || minCap < 1) errs.minCap = 'Min ≥ 1.';
      if (!Number.isFinite(maxCap) || maxCap < 1) errs.maxCap = 'Max ≥ 1.';
      if (Number.isFinite(minCap) && Number.isFinite(maxCap) && minCap > maxCap) errs.maxCap = 'Max must be ≥ Min.';
      if (!Number.isFinite(rate) || rate < 0) errs.rate = 'Rate ≥ 0.';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      const newRoom = { id, name, minCap, maxCap, rate, blurb: String(d.blurb || '').trim(), parentId: d.parentId || null };
      ROOMS[id] = newRoom;
      ALL_ROOM_IDS.push(id);
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'addRoom', detail: `${id} (${name})`, result: 'SUCCESS' });
      state.detailModal = null;
      render();
      showToast(`Room "${name}" added`);
      break;
    }
    case 'save-blockout': {
      const m = state.detailModal; if (!m || !m.draft) break;
      const d = m.draft;
      const errs = {};
      if (!d.room) errs.room = 'Room is required.';
      if (!d.date) errs.date = 'Date is required.';
      // Either both empty (whole day) or both filled with end > start.
      if (d.start && !d.end) errs.end = 'Set an end time, or clear both for whole-day.';
      if (!d.start && d.end) errs.end = 'Set a start time, or clear both for whole-day.';
      if (d.start && d.end && parseInt(d.end,10) <= parseInt(d.start,10)) errs.end = 'End must be after start.';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      const newBO = {
        id: 'BO-' + Date.now(),
        room: d.room,
        date: d.date,
        start: d.start || '',
        end: d.end || '',
        reason: String(d.reason || '').trim(),
      };
      api.blockouts.unshift(newBO);
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'addBlockout', detail: `${newBO.id} ${newBO.room} ${newBO.date}`, result: 'SUCCESS' });
      dbInsertBlockout(newBO);
      dbInsertAudit(api.audit[0]);
      state.detailModal = null;
      render();
      showToast('Blockout added');
      break;
    }
    case 'save-blacklist': {
      const m = state.detailModal; if (!m || !m.draft) break;
      const d = m.draft;
      const errs = {};
      const email = String(d.email || '').trim().toLowerCase();
      if (!email) errs.email = 'Email is required.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.email = 'Enter a valid email.';
      else if (api.blacklist.some(b => b.email.toLowerCase() === email)) errs.email = 'This email is already blacklisted.';
      if (!String(d.reason || '').trim()) errs.reason = 'Reason is required.';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      api.blacklist.unshift({ email, reason: String(d.reason).trim() });
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'addBlacklist', detail: email, result: 'SUCCESS' });
      dbInsertBlacklist(email, String(d.reason).trim());
      dbInsertAudit(api.audit[0]);
      state.detailModal = null;
      render();
      showToast(`${email} blacklisted`);
      break;
    }

    /* Inline booking edit (owner + Pending only) */
    case 'edit-booking': {
      const no = target.getAttribute('data-no');
      const b = api.bookings.find(x => x.no === no);
      if (!b || b.status !== 'submitted') break;
      if ((b.email || '').toLowerCase() !== CURRENT_USER.email.toLowerCase()) break;
      const c = b.contact || {};
      state.detailModal = {
        kind: 'booking', record: b, title: `Edit booking ${no}`,
        editing: true,
        draft: {
          name:   c.name   || '',
          phone:  c.phone  || b.phone || '',
          remark: c.remark || '',
          cart:   { ...(b.cart || {}) },
        },
        activeCat: (CATS && CATS[0]) || 'Coffee',
        errors: {},
      };
      render(); break;
    }
    case 'edit-cancel': {
      if (state.detailModal && state.detailModal.record) {
        const b = state.detailModal.record;
        state.detailModal = { kind: 'booking', record: b, title: `Booking ${b.no}` };
      } else {
        state.detailModal = null;
      }
      render(); break;
    }
    case 'edit-set-cat': {
      if (state.detailModal) state.detailModal.activeCat = target.getAttribute('data-cat');
      render(); break;
    }
    case 'edit-qty-set': {
      if (!state.detailModal || !state.detailModal.draft) break;
      const pid = target.getAttribute('data-pid');
      const qty = parseInt(target.getAttribute('data-qty'), 10) || 0;
      state.detailModal.draft.cart = state.detailModal.draft.cart || {};
      if (qty <= 0) delete state.detailModal.draft.cart[pid];
      else state.detailModal.draft.cart[pid] = qty;
      render(); break;
    }
    case 'edit-save': {
      const no = target.getAttribute('data-no');
      const b = api.bookings.find(x => x.no === no);
      const m = state.detailModal;
      if (!b || !m || !m.draft) break;
      // Re-check edit gate at save time — defends against stale state.
      if (b.status !== 'submitted' || (b.email || '').toLowerCase() !== CURRENT_USER.email.toLowerCase()) {
        m.editing = false; render(); break;
      }
      // Validate
      const errs = {};
      const name = (m.draft.name || '').trim();
      const phoneDigits = (m.draft.phone || '').replace(/\D/g, '');
      if (!name) errs.name = 'Name is required.';
      if (phoneDigits.length !== 10) errs.phone = 'Enter a 10-digit phone number.';
      if (CONFIG.cateringMandatory) {
        const total = Object.values(m.draft.cart || {}).reduce((s, q) => s + q, 0);
        if (total === 0) errs.catering = 'At least one catering item is required.';
      }
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      // Diff for the audit log
      const before = { name: (b.contact && b.contact.name) || '', phone: (b.contact && b.contact.phone) || b.phone || '', remark: (b.contact && b.contact.remark) || '', cart: { ...(b.cart || {}) } };
      const after  = { name, phone: m.draft.phone, remark: m.draft.remark || '', cart: { ...(m.draft.cart || {}) } };
      // Write back
      b.contact = { ...(b.contact || {}), name, phone: m.draft.phone, remark: m.draft.remark || '', email: b.email };
      b.phone = m.draft.phone;
      b.cart = { ...(m.draft.cart || {}) };
      api.audit.unshift({
        ts: new Date().toISOString(), actor: CURRENT_USER.email,
        action: 'editBooking', detail: `${no}: ${JSON.stringify({ before, after })}`,
        result: 'SUCCESS'
      });
      // Persist changes to Supabase
      dbUpdateBooking(no, { phone: b.phone, contact: b.contact, cart: b.cart });
      dbInsertAudit(api.audit[0]);
      // Exit edit mode, keep modal open in read view
      state.detailModal = { kind: 'booking', record: b, title: `Booking ${no}` };
      render();
      showToast('Booking updated');
      break;
    }

    /* Admin status transitions */
    case 'admin-confirm':
    case 'admin-checkin':
    case 'admin-complete':
    case 'admin-reject': {
      const no = target.getAttribute('data-no');
      const next = ({ 'admin-confirm': 'booked', 'admin-checkin': 'checked-in', 'admin-complete': 'completed', 'admin-reject': 'rejected' })[action];
      const b = api.bookings.find(x => x.no === no);
      if (b) {
        b.status = next;
        api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: action.replace('admin-', ''), detail: `${no} → ${next}`, result: 'SUCCESS' });
        state.detailModal = { kind: 'booking', record: b, title: `Booking ${no}` };
        dbUpdateBookingStatus(no, next);
        dbInsertAudit(api.audit[0]);
      }
      render(); break;
    }
    case 'user-cancel': {
      const no = target.getAttribute('data-no');
      const b = api.bookings.find(x => x.no === no);
      if (b) {
        b.status = 'cancelled';
        api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'cancelBooking', detail: no, result: 'SUCCESS' });
        state.detailModal = { kind: 'booking', record: b, title: `Booking ${no}` };
        dbUpdateBookingStatus(no, 'cancelled');
        dbInsertAudit(api.audit[0]);
      }
      render(); break;
    }
    case 'delete-blockout': {
      const id = target.getAttribute('data-id');
      api.blockouts = api.blockouts.filter(b => b.id !== id);
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'deleteBlockout', detail: id, result: 'SUCCESS' });
      dbDeleteBlockout(id);
      dbInsertAudit(api.audit[0]);
      state.detailModal = null;
      render(); break;
    }
    case 'delete-blacklist': {
      const email = target.getAttribute('data-email');
      api.blacklist = api.blacklist.filter(b => b.email !== email);
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'deleteBlacklist', detail: email, result: 'SUCCESS' });
      dbDeleteBlacklist(email);
      dbInsertAudit(api.audit[0]);
      state.detailModal = null;
      render(); break;
    }
    case 'save-admin': {
      const m = state.detailModal; if (!m || !m.draft) break;
      const d = m.draft;
      const errs = {};
      const email = String(d.email || '').trim().toLowerCase();
      if (!email) errs.email = 'Email is required.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.email = 'Enter a valid email address.';
      else if (api.admins.some(a => a.email.toLowerCase() === email)) errs.email = 'This email is already an admin.';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      api.admins.push({ email, addedAt: new Date().toISOString() });
      ADMINS.add(email);
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'addAdmin', detail: email, result: 'SUCCESS' });
      dbInsertAdmin(email);
      dbInsertAudit(api.audit[0]);
      state.detailModal = null;
      render();
      showToast(`${email} added as admin`);
      break;
    }
    case 'delete-admin': {
      const email = target.getAttribute('data-email');
      const me = (CURRENT_USER.email || '').toLowerCase();
      if (!email || email.toLowerCase() === me) break; // safety: can't remove self
      api.admins = api.admins.filter(a => a.email.toLowerCase() !== email.toLowerCase());
      ADMINS.delete(email.toLowerCase());
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'removeAdmin', detail: email, result: 'SUCCESS' });
      dbDeleteAdmin(email);
      dbInsertAudit(api.audit[0]);
      render();
      showToast(`${email} removed`);
      break;
    }

    /* Schedule: date navigation + panel */
    case 'sched-prev': {
      const d = new Date(state.scheduleDate || today());
      d.setDate(d.getDate() - 1);
      state.scheduleDate = d;
      render(); break;
    }
    case 'sched-next': {
      const d = new Date(state.scheduleDate || today());
      d.setDate(d.getDate() + 1);
      state.scheduleDate = d;
      render(); break;
    }
    case 'sched-today': {
      state.scheduleDate = today();
      render(); break;
    }
    case 'open-sched-booking': {
      const no = target.getAttribute('data-no');
      state.schedModal = { type: 'booking', no };
      render(); break;
    }
    case 'open-sched-slot': {
      const roomId = target.getAttribute('data-room');
      const hour   = parseInt(target.getAttribute('data-hour'), 10);
      state.schedModal = { type: 'slot', roomId, hour };
      render(); break;
    }
    case 'close-sched-modal': {
      state.schedModal = null;
      render(); break;
    }
    case 'sched-confirm':
    case 'sched-checkin':
    case 'sched-complete':
    case 'sched-reject': {
      const no = target.getAttribute('data-no');
      const next = ({ 'sched-confirm': 'booked', 'sched-checkin': 'checked-in', 'sched-complete': 'completed', 'sched-reject': 'rejected' })[action];
      const b = api.bookings.find(x => x.no === no);
      if (b) {
        b.status = next;
        api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: action.replace('sched-', ''), detail: `${no} → ${next}`, result: 'SUCCESS' });
        state.schedModal = { type: 'booking', no }; // keep modal open, refreshed with new status
        dbUpdateBookingStatus(no, next);
        dbInsertAudit(api.audit[0]);
      }
      render();
      showToast(`${no} → ${next}`);
      break;
    }

    /* Catering: master toggles */
    case 'toggle-catering-cfg': {
      const key = target.getAttribute('data-key');
      if (key === 'cateringEnabled') CONFIG.cateringEnabled = target.checked;
      if (key === 'cateringMandatory') CONFIG.cateringMandatory = target.checked;
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'updateCateringCfg', detail: `${key}=${target.checked}`, result: 'SUCCESS' });
      render(); break;
    }

    /* Catering: category CRUD */
    case 'select-cat': {
      state.cateringCat = target.getAttribute('data-cat');
      render(); break;
    }
    case 'create-cat': {
      state.detailModal = { kind: 'catering-cat', mode: 'create', title: 'Add category', draft: { name: '' }, errors: {} };
      render(); break;
    }
    case 'edit-cat': {
      const cat = target.getAttribute('data-cat');
      state.detailModal = { kind: 'catering-cat', mode: 'edit', title: 'Rename category', cat, draft: { name: cat }, errors: {} };
      render(); break;
    }
    case 'delete-cat': {
      const cat = target.getAttribute('data-cat');
      state.detailModal = { kind: 'catering-cat', mode: 'delete', title: 'Delete category', cat };
      render(); break;
    }
    case 'save-cat': {
      const m = state.detailModal; if (!m || !m.draft) break;
      const name = String(m.draft.name || '').trim();
      const errs = {};
      if (!name) errs.name = 'Category name is required.';
      else if (m.mode === 'create' && CATS.includes(name)) errs.name = 'This category already exists.';
      else if (m.mode === 'edit' && name !== m.cat && CATS.includes(name)) errs.name = 'A category with this name already exists.';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      if (m.mode === 'create') {
        CATS.push(name);
        state.cateringCat = name;
      } else {
        const idx = CATS.indexOf(m.cat);
        if (idx >= 0) CATS[idx] = name;
        PRODUCTS.forEach(p => { if (p.cat === m.cat) p.cat = name; });
        if (state.cateringCat === m.cat) state.cateringCat = name;
      }
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: m.mode === 'create' ? 'addCateringCat' : 'renameCateringCat', detail: name, result: 'SUCCESS' });
      state.detailModal = null;
      render();
      showToast(m.mode === 'create' ? `Category "${name}" added` : `Renamed to "${name}"`);
      break;
    }
    case 'confirm-delete-cat': {
      const cat = target.getAttribute('data-cat');
      const idx = CATS.indexOf(cat);
      if (idx >= 0) CATS.splice(idx, 1);
      for (let i = PRODUCTS.length - 1; i >= 0; i--) {
        if (PRODUCTS[i].cat === cat) PRODUCTS.splice(i, 1);
      }
      if (state.cateringCat === cat) state.cateringCat = CATS[0] || null;
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'deleteCateringCat', detail: cat, result: 'SUCCESS' });
      state.detailModal = null;
      render();
      showToast(`"${cat}" deleted`);
      break;
    }

    /* Catering: product CRUD */
    case 'create-product': {
      const cat = target.getAttribute('data-cat') || state.cateringCat || CATS[0] || '';
      state.detailModal = { kind: 'catering-product', mode: 'create', title: 'Add product', draft: { name: '', price: '', desc: '', cat, enabled: true }, errors: {} };
      render(); break;
    }
    case 'open-product': {
      const pid = target.getAttribute('data-pid');
      const p = PRODUCTS.find(x => x.id === pid);
      if (!p) break;
      state.detailModal = { kind: 'catering-product', mode: 'view', title: p.name, pid };
      render(); break;
    }
    case 'edit-product': {
      const pid = target.getAttribute('data-pid');
      const p = PRODUCTS.find(x => x.id === pid);
      if (!p) break;
      state.detailModal = { kind: 'catering-product', mode: 'edit', title: 'Edit product', pid, draft: { name: p.name, price: p.price, desc: p.desc || '', cat: p.cat, enabled: p.enabled }, errors: {} };
      render(); break;
    }
    case 'save-product': {
      const m = state.detailModal; if (!m || !m.draft) break;
      const d = m.draft;
      const errs = {};
      const name = String(d.name || '').trim();
      const price = parseFloat(d.price);
      const cat = String(d.cat || '').trim();
      if (!name) errs.name = 'Name is required.';
      if (isNaN(price) || price < 0) errs.price = 'Enter a valid price.';
      if (!cat || !CATS.includes(cat)) errs.cat = 'Select a category.';
      if (Object.keys(errs).length) { m.errors = errs; render(); break; }
      if (m.mode === 'create') {
        PRODUCTS.push({ id: 'p' + Date.now(), cat, name, price, desc: String(d.desc || '').trim(), enabled: d.enabled !== false });
        state.cateringCat = cat;
        api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'addCateringProduct', detail: name, result: 'SUCCESS' });
        showToast(`"${name}" added`);
      } else {
        const p = PRODUCTS.find(x => x.id === m.pid);
        if (p) { p.name = name; p.price = price; p.desc = String(d.desc || '').trim(); p.cat = cat; p.enabled = d.enabled !== false; }
        state.cateringCat = cat;
        api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'updateCateringProduct', detail: name, result: 'SUCCESS' });
        showToast(`"${name}" updated`);
      }
      state.detailModal = null;
      render(); break;
    }
    case 'delete-product': {
      const pid = target.getAttribute('data-pid');
      const p = PRODUCTS.find(x => x.id === pid);
      const idx = PRODUCTS.findIndex(x => x.id === pid);
      if (idx >= 0) PRODUCTS.splice(idx, 1);
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'deleteCateringProduct', detail: p ? p.name : pid, result: 'SUCCESS' });
      state.detailModal = null; // close the product view modal after deletion
      render();
      showToast(p ? `"${p.name}" deleted` : 'Product deleted');
      break;
    }
    case 'toggle-product': {
      const pid = target.getAttribute('data-pid');
      const p = PRODUCTS.find(x => x.id === pid);
      if (p) { p.enabled = !p.enabled; render(); showToast(p.enabled ? `"${p.name}" active` : `"${p.name}" hidden`); }
      break;
    }

    /* Admin: save brand visual */
    case 'save-brand': {
      const v = state.brandValues || {};
      const BRAND_KEYS = ['logoMarkUrl','brandName','brandSub','brandCopyright','loginBgImage','loginBgColor','loginMobileBgImage','loginEyebrow','loginHeadline','loginLede','loginBullet0','loginBullet1','loginBullet2','loginFooter'];
      BRAND_KEYS.forEach(k => { if (v[k] !== undefined) { CONFIG[k] = v[k]; delete v[k]; } });
      api.audit.unshift({ ts: new Date().toISOString(), actor: CURRENT_USER.email, action: 'updateBrand', detail: 'Login page brand visual updated', result: 'SUCCESS' });
      render();
      showToast('Brand visual saved');
      break;
    }

    /* Admin: save configuration */
    case 'save-config': {
      const vals = state.configValues || {};
      // Fall back to current CONFIG values if the user didn't touch a field.
      const minDays = parseInt(vals.minDays != null ? vals.minDays : CONFIG.nonAdminMinDays, 10);
      const maxDays = parseInt(vals.maxDays != null ? vals.maxDays : CONFIG.nonAdminMaxDays, 10);
      const errs = {};
      state.configErrors = null;
      if (!Number.isFinite(minDays) || minDays < 0) errs.minDays = 'Min ≥ 0.';
      if (!Number.isFinite(maxDays) || maxDays < 1) errs.maxDays = 'Max ≥ 1.';
      if (Object.keys(errs).length) { state.configErrors = errs; render(); break; }
      // Update CONFIG and audit-log
      CONFIG.nonAdminMinDays = minDays;
      CONFIG.nonAdminMaxDays = maxDays;
      api.audit.unshift({
        ts: new Date().toISOString(), actor: CURRENT_USER.email,
        action: 'updateConfig', detail: `min=${minDays}, max=${maxDays}`,
        result: 'SUCCESS'
      });
      state.configValues = null;
      state.configErrors = null;
      render();
      showToast('Saved successfully');
      break;
    }

    /* Admin: display-text edits */
    case 'save-text': {
      const section = target.getAttribute('data-section');
      const v = state.textValues || {};
      // Keys to commit per section. Missing keys fall back to CONFIG unchanged.
      const sectionKeys = {
        'branding':     ['bannerEyebrow', 'bannerTitle', 'bannerDesc'],
        'notice':       ['globalNoticeEnabled', 'globalNoticeTitle', 'globalNoticeMessage'],
        'booking-flow': ['termsAndConditions', 'bookingSubmittedMessage'],
        'faq':          ['helpEyebrow', 'helpTitle', 'helpDesc', 'faqs'],
      }[section] || [];
      let changed = 0;
      sectionKeys.forEach(k => {
        if (v[k] !== undefined) {
          CONFIG[k] = v[k];
          delete v[k];
          changed++;
        }
      });
      api.audit.unshift({
        ts: new Date().toISOString(), actor: CURRENT_USER.email,
        action: 'updateText', detail: `section=${section} (${changed} field${changed === 1 ? '' : 's'})`,
        result: 'SUCCESS'
      });
      render();
      showToast('Saved successfully');
      break;
    }
    case 'faq-add': {
      state.textValues = state.textValues || {};
      state.textValues.faqs = state.textValues.faqs || JSON.parse(JSON.stringify(CONFIG.faqs || []));
      state.textValues.faqs.push({ q: '', a: '' });
      render(); break;
    }
    case 'faq-remove': {
      const i = parseInt(target.getAttribute('data-i'), 10);
      state.textValues = state.textValues || {};
      state.textValues.faqs = state.textValues.faqs || JSON.parse(JSON.stringify(CONFIG.faqs || []));
      state.textValues.faqs.splice(i, 1);
      render(); break;
    }
    case 'faq-move': {
      const i = parseInt(target.getAttribute('data-i'), 10);
      const dir = parseInt(target.getAttribute('data-dir'), 10);
      state.textValues = state.textValues || {};
      state.textValues.faqs = state.textValues.faqs || JSON.parse(JSON.stringify(CONFIG.faqs || []));
      const j = i + dir;
      if (j >= 0 && j < state.textValues.faqs.length) {
        [state.textValues.faqs[i], state.textValues.faqs[j]] = [state.textValues.faqs[j], state.textValues.faqs[i]];
      }
      render(); break;
    }

    /* Custom dropdown (drop-in <select> replacement) */
    case 'toggle-dropdown': {
      const key = target.getAttribute('data-key');
      state.openDropdown = state.openDropdown === key ? null : key;
      render(); break;
    }
    case 'pick-dropdown': {
      const key = target.getAttribute('data-key');
      const value = target.getAttribute('data-value');
      if (key === 'admin-bookings-date') {
        state.adminBookingsFilters = state.adminBookingsFilters || { status: 'all', date: 'upcoming', customFrom: '', customTo: '' };
        state.adminBookingsFilters.date = value;
      } else if (state.detailModal && state.detailModal.draft) {
        // Map dropdown key to draft field name when they differ
        const draftKey = key === 'prod-cat' ? 'cat' : key;
        state.detailModal.draft[draftKey] = value;
      }
      state.openDropdown = null;
      render(); break;
    }

    /* ── QR scanner ─────────────────────────────────────────────── */
    case 'open-scanner': {
      state.scanner = { status: 'starting', error: '', manualCode: '' };
      render(); break;
    }
    case 'close-scanner': {
      stopScanner();
      state.scanner = null;
      render(); break;
    }
    case 'scanner-manual-submit': {
      const code = (state.scanner && state.scanner.manualCode || '').trim();
      if (!code) { showToast('Enter a booking number', 'error'); break; }
      handleScannerHit(code);
      break;
    }
    case 'download-qr': {
      const no = target.getAttribute('data-no');
      // Find the QR SVG in the current modal and rasterise to PNG.
      const svg = document.querySelector('.booking-qr-art svg');
      if (!svg || !no) { showToast('Could not save QR', 'error'); break; }
      const xml = new XMLSerializer().serializeToString(svg);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = () => {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `${no}.png`;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 500);
          showToast('QR saved');
        }, 'image/png');
      };
      img.onerror = () => showToast('Could not save QR', 'error');
      img.src = 'data:image/svg+xml;base64,' + svg64;
      break;
    }

    /* ── Manage-bookings filters ─────────────────────────────────── */
    case 'filter-bookings-status': {
      state.adminBookingsFilters = state.adminBookingsFilters || { status: 'all', date: 'upcoming', customFrom: '', customTo: '' };
      state.adminBookingsFilters.status = target.getAttribute('data-status') || 'all';
      render(); break;
    }
    case 'filter-bookings-custom': {
      // Wired via the native change listener in attachListeners(); the click
      // pipeline shouldn't trigger here. Kept as a no-op so the catch-all
      // doesn't complain when a date input dispatches a click bubble.
      break;
    }
    case 'clear-booking-filters': {
      state.adminBookingsFilters = { status: 'all', date: 'upcoming', customFrom: '', customTo: '' };
      render(); break;
    }

    case 'retry-load': {
      state.loading   = true;
      state.loadError = '';
      render();
      loadAllData();
      break;
    }

    case 'noop': break;
  }
}

/* ────────────────────────────────────────────────────────────────────
   BOOT
   loadAllData() fetches all tables from Supabase (if configured), populates
   the api.* arrays, then calls render(). If Supabase is not configured it
   skips straight to render() with the built-in demo data.
──────────────────────────────────────────────────────────────────── */
loadAllData();
</script>
</body>
</html>
